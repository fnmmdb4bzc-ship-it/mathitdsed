server {
    listen 80;
    server_name _;

    # Only the three files below are ever served, by exact path. The repo is
    # mounted at /srv/app (a *directory* mount - single-file bind mounts break
    # the moment an editor replaces the file's inode), so this allow-list is
    # what keeps backend/, keycloak/ and .git out of reach over HTTP.
    root /srv/web;

    location = / {
        root /srv/app;
        try_files /MathIT.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        root /srv/app;
        try_files /MathIT.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /MathIT.html {
        root /srv/app;
        try_files /MathIT.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /mathit-auth.js {
        try_files /mathit-auth.js =404;
        add_header Cache-Control "no-store" always;
    }

    location = /admin.html {
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Same-origin proxy to the API: no CORS preflight, and the frontend can
    # just call /api/... without knowing where the backend lives.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
