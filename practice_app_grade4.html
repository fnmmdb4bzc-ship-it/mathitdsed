<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 4 Maths Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean: #0284C7;
    --ocean-dark: #075985;
    --ocean-light: #E0F2FE;
    --aqua: #06B6D4;
    --aqua-dark: #0E7490;
    --aqua-light: #CFFAFE;
    --coral: #FB7185;
    --coral-dark: #E11D48;
    --coral-light: #FFE4E6;
    --sand: #D9A441;
    --sand-dark: #A8791F;
    --sand-light: #FBF0DA;
    --grey-bg: #F2FAFB;
    --card-bg: #FFFFFF;
    --border: #D9EEF3;
    --text: #12303B;
    --text-soft: #4F7480;
    --good: #157F3C;
    --good-bg: #E6F5EA;
    --bad: #C0392B;
    --bad-bg: #FBEAEA;
    --shade: var(--ocean);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 6% 10%, rgba(6,182,212,0.08) 0, transparent 40%),
      radial-gradient(circle at 94% 16%, rgba(251,113,133,0.07) 0, transparent 42%),
      radial-gradient(circle at 50% 96%, rgba(217,164,65,0.08) 0, transparent 45%),
      var(--grey-bg);
    color: var(--text);
  }
  h1, h2, h3, .tile h3, button { font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, sans-serif; }
  header {
    position: relative;
    background: linear-gradient(120deg, var(--ocean-dark) 0%, var(--ocean) 50%, var(--aqua) 100%);
    color: #fff;
    padding: 26px 20px 40px;
    text-align: center;
    overflow: hidden;
  }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; font-weight: 800; letter-spacing: 0.02em; }
  header p { margin: 0; color: #E3F7FB; font-size: 0.92rem; }
  header .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 30px; display: block; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(2,132,199,0.07);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .section-heading {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; color: var(--ocean-dark);
    font-size: 1.1rem; margin: 24px 0 10px; padding-left: 2px;
  }
  .section-heading:first-child { margin-top: 4px; }
  .tile {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border-top: 4px solid var(--tile-color, var(--ocean));
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(2,132,199,0.16); }
  .tile .dot {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    background: var(--tile-bg, var(--ocean-light));
    color: var(--tile-color, var(--ocean));
  }
  .tile h3 { margin: 0 0 4px; font-size: 1.0rem; color: var(--ocean-dark); font-weight: 700; }
  .tile p { margin: 0; font-size: 0.82rem; color: var(--text-soft); }
  .tile .badge { display: inline-block; font-size: 0.68rem; font-weight: 700; color: var(--coral-dark); background: var(--coral-light); border-radius: 8px; padding: 2px 7px; margin-top: 6px; }
  .backbtn {
    background: none; border: none; color: var(--coral-dark); font-weight: 700;
    cursor: pointer; font-size: 0.92rem; padding: 4px 0; margin-bottom: 10px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .backbtn:hover { text-decoration: underline; }
  h2.activity-title { color: var(--ocean-dark); margin: 0 0 6px; font-size: 1.4rem; font-weight: 800; }
  .subtext { color: var(--text-soft); font-size: 0.92rem; margin: 0 0 14px; line-height: 1.4; }
  .levelnote { display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--coral-dark); background: var(--coral-light); border-radius: 8px; padding: 3px 9px; margin: 0 0 12px; }

  .tutor-box { margin-bottom: 16px; }
  button.tutor-toggle {
    background: var(--sand-light); color: #6B4E14; border: 1.5px dashed var(--sand);
    border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
  }
  button.tutor-toggle:hover { background: #F5E3BC; }
  .tutor-panel {
    display: none; margin-top: 10px; background: var(--sand-light); border-radius: 10px;
    padding: 12px 14px; font-size: 0.86rem; color: #5C4110; line-height: 1.5; border-left: 4px solid var(--sand);
  }

  button.action {
    background: linear-gradient(120deg, var(--coral), #FB8FA0); color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    margin-right: 8px; margin-top: 8px;
  }
  button.action:hover { filter: brightness(0.95); }
  button.secondary {
    background: #fff; color: var(--ocean-dark); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    margin-right: 8px; margin-top: 8px;
  }
  button.secondary:hover { border-color: var(--ocean); }
  button.small { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }
  input[type=text], input[type=number] {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px;
    font-size: 1rem; width: 130px; margin-right: 8px;
  }
  input[type=text]:focus, input[type=number]:focus { outline: 2px solid var(--coral); border-color: var(--coral); }
  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-weight: 700;
    display: none; font-size: 0.95rem;
  }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .feedback.info { display: block; background: var(--aqua-light); color: var(--aqua-dark); font-weight: 600; }
  .scorepill {
    display: inline-block; background: var(--aqua-light); color: var(--aqua-dark);
    font-weight: 800; font-size: 0.85rem; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px;
  }
  .q-box {
    font-size: 1.15rem; font-weight: 700; color: var(--ocean-dark); margin: 14px 0;
    background: var(--ocean-light); border-radius: 12px; padding: 14px 16px;
  }
  .mcq-opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .mcq-opt {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 16px;
    cursor: pointer; font-weight: 700; color: var(--ocean-dark); background: #fff;
  }
  .mcq-opt:hover { border-color: var(--coral); }
  .mcq-opt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .mcq-opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .fracbar { display: flex; gap: 2px; margin: 6px 0; }
  .fracbar .seg { flex: 1; height: 34px; border: 1.5px solid var(--ocean-dark); background: #fff; }
  .fracbar .seg.filled { background: var(--coral); }
  .fracbar .seg:first-child { border-radius: 6px 0 0 6px; }
  .fracbar .seg:last-child { border-radius: 0 6px 6px 0; }
  .fraclabel { font-size: 0.85rem; color: var(--text-soft); margin-bottom: 2px; }
  .pattern-grid { display: grid; gap: 3px; margin: 8px 0; }
  .pattern-grid .blk { width: 22px; height: 22px; border-radius: 4px; background: var(--border); }
  .pattern-grid .blk.on { background: var(--coral); }
  .pattern-step { display: inline-block; text-align: center; margin: 0 16px 10px 0; vertical-align: top; }
  .pattern-step .count { font-weight: 800; color: var(--ocean-dark); margin-top: 4px; }
  .hint-toggle { color: var(--aqua-dark); background: none; border: none; cursor: pointer; font-size: 0.88rem; font-weight: 700; padding: 0; margin-top: 10px; }
  .hint-text { display: none; margin-top: 8px; font-size: 0.88rem; color: var(--text-soft); background: var(--aqua-light); padding: 10px 12px; border-radius: 10px; }
  .posgrid { display: inline-grid; gap: 2px; margin: 10px 0; }
  .posgrid .pcell { width: 42px; height: 42px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .posgrid .pcell.clickable { cursor: pointer; }
  .posgrid .pcell.clickable:hover { background: var(--ocean-light); }
  .posgrid .pcell.start { background: var(--sand-light); border-color: var(--sand); }
  .posgrid .pcell.picked { background: var(--coral-light); border-color: var(--coral); }
  .posgrid .pcell.headcell { background: var(--ocean-dark); color: #fff; font-weight: 700; font-size: 0.8rem; }
  footer { text-align: center; color: var(--text-soft); font-size: 0.8rem; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Grade 4 Maths Practice</h1>
  <p>CAPS aligned practice, mostly Term 2 and Term 3, with a few bonus topics marked below</p>
  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none">
    <path d="M0,30 C240,60 480,0 720,18 C960,36 1200,60 1440,28 L1440,60 L0,60 Z" fill="#F2FAFB"></path>
  </svg>
</header>
<main id="app"></main>
<footer>Built for independent practice between sessions. All content authored to match CAPS Grade 4, not from an official past paper bank.</footer>

<script>
// ---------- Utilities ----------
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fracBar(numerator, denominator) {
  let segs = '';
  for (let i = 0; i < denominator; i++) segs += `<div class="seg ${i < numerator ? 'filled' : ''}"></div>`;
  return `<div class="fracbar">${segs}</div>`;
}

const app = document.getElementById('app');
const BEACH = ['ocean', 'aqua', 'coral', 'sand'];

// ---------- Tutor explanations ----------
const TUTOR_NOTES = {
  placevalue: "Grade 4 numbers go up to 9999, so this checks the same skill as bundling on a place value chart, just one column further than Grade 3. If she cannot do this confidently for 3 digit numbers yet, it is worth stepping back before pushing into thousands.",
  compare: "Comparing starts from the leftmost digit, the biggest place value column, not the last digit. If she compares from the right, that is the exact misconception to address, and a place value chart makes it visible.",
  doublehalf: "Doubling and halving are mental math anchors that support multiplication and division later, doubling is really multiplying by 2, halving is dividing by 2. If she has to count on her fingers for double 6, that fact is worth drilling on its own before moving on.",
  fillten: "This is the mental strategy behind carrying and borrowing, knowing how far a number is from the next multiple of ten makes column addition and subtraction click. Say it out loud as a question, for example forty seven and how much more makes fifty.",
  addsub: "By Term 2, Grade 4 learners are expected to add and subtract 4 digit numbers, usually with regrouping. If the column method breaks down, go back to expanded notation, writing each number out in thousands, hundreds, tens and units, before returning to the short method. Start on an easier level here if 4 digits are still shaky.",
  multiply: "CAPS builds this up in stages, 2 digit by 1 digit first, then 2 digit by 2 digit. Do not move to the harder mode until the easier one is fluent, since the strategies, like breaking numbers apart, build directly on each other.",
  divide: "CAPS Grade 4 introduces division as the inverse of multiplication, so if she knows that 6 times 7 is 42, she already knows that 42 divided by 6 is 7. Point that connection out explicitly. The remainder mode is a natural next step once exact division is solid.",
  numsentence: "A number sentence with a missing number is algebra in disguise. Encourage her to say the sentence in words first, for example twenty four plus what number makes sixty one, rather than jumping straight to an operation.",
  tables: "Multiplication and division both depend on this fluency. A few minutes of mixed recall most days beats one long weekly drill.",
  comparefrac: "This is the exact CAPS Grade 4 skill, comparing fractions with different denominators using a picture, not a rule. Resist teaching a shortcut for finding common denominators yet, the visual comparison here is what builds the number sense that later shortcuts rely on.",
  addfrac: "Grade 4 CAPS only expects addition and subtraction of fractions with the same denominator. If a worksheet shows different denominators, that is Grade 5 content, so it is fine to say so and come back to it later.",
  length: "Millimetres, centimetres and metres are the units Grade 4 uses most, kilometres are introduced but used less often. A tape measure or metre stick at home makes these conversions concrete rather than a memorised rule.",
  capacity: "Millilitres and litres are easiest to feel using real containers, an empty two litre bottle or a measuring jug is worth more than several worksheets on its own.",
  mass: "Grams and kilograms work the same way as the other units, a kitchen scale is a genuinely useful manipulative here, weighing real household items builds a sense of scale a worksheet alone cannot.",
  time: "CAPS places formal time work in Term 4, so if you are working through Term 2 and 3 in order this is a preview, not a repeat of something she has already covered. Reading an analogue clock still depends on place value thinking, since the minute hand jumps in groups of 5.",
  shapes3d: "Flat faces versus curved surfaces is the core Grade 4 distinction. A tin can, a ball and a cereal box are all sitting in the kitchen, so this is another good topic to teach with real objects rather than only pictures. Counting edges and vertices is slightly beyond the Grade 4 wording but is good solid extension practice once faces are secure.",
  symmetry: "Line symmetry is genuine Grade 4 Term 3 content. A real mirror placed on the line is the fastest way to check an answer, if the reflection matches, the line is a line of symmetry.",
  gridref: "This is the actual Grade 4 CAPS position skill, using letters across the top and numbers up the side, like a simple map or a battleships style grid. It is a different skill from describing a movement, which comes next as a bonus topic.",
  angles: "This one is a preview of Grade 5, Grade 4 CAPS only covers straight versus curved sides. It is still worth introducing gently if she is ready, comparing an angle to the corner of a book, a right angle, is the easiest way in.",
  translate: "This is also a preview of Grade 5, formal translations are not Grade 4 content. Grade 4 only uses alpha-numeric grid references, so treat this as an optional stretch activity rather than core practice.",
  numpattern: "CAPS Grade 4 patterns either add or subtract the same amount each time, or multiply by the same amount each time. Ask her to say the rule out loud before finding the next number, guessing without a rule is not the skill being tested here. The complex level goes beyond a constant rule, which is good stretch thinking but should not be the first thing she tries.",
  geopattern: "These patterns grow in a picture, not just in a list of numbers, so counting the blocks in each step by hand, out loud, before answering is more valuable here than mental arithmetic alone.",
};
function tutorHTML(key) {
  return `
    <div class="tutor-box">
      <button class="tutor-toggle" onclick="toggleTutor('${key}')">For the tutor: what this is really practising</button>
      <div class="tutor-panel" id="tutor-${key}">${TUTOR_NOTES[key]}</div>
    </div>
  `;
}
function toggleTutor(key) {
  const panel = document.getElementById('tutor-' + key);
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

// ---------- Activity registry ----------
const SECTIONS = [
  { title: 'Number Sense', keys: ['placevalue', 'compare', 'doublehalf', 'fillten'] },
  { title: 'Operations', keys: ['addsub', 'multiply', 'divide', 'numsentence', 'tables'] },
  { title: 'Fractions', keys: ['comparefrac', 'addfrac'] },
  { title: 'Measurement', keys: ['length', 'capacity', 'mass', 'time'] },
  { title: 'Space and Shape', keys: ['shapes3d', 'symmetry', 'gridref', 'angles', 'translate'] },
  { title: 'Patterns', keys: ['numpattern', 'geopattern'] },
];
const ACTIVITIES = {
  placevalue: { icon: '🔢', title: 'Place Value Explorer', desc: 'Find the value of a digit in a 4 digit number.' },
  compare: { icon: '⚖️', title: 'Compare and Order', desc: 'Choose the correct sign, less than, greater than, or equal to.' },
  doublehalf: { icon: '🪞', title: 'Double and Half', desc: 'Double or halve a number, with 3 difficulty levels.' },
  fillten: { icon: '🎯', title: 'Filling Up Tens', desc: 'How much more to reach the next friendly number.' },
  addsub: { icon: '➕', title: 'Add and Subtract Blitz', desc: 'Choose 2, 3 or 4 digit numbers.' },
  multiply: { icon: '✖️', title: 'Multiplication Practice', desc: '2 digit by 1 digit, and 2 digit by 2 digit.' },
  divide: { icon: '➗', title: 'Division Practice', desc: 'With an exact answer, or with a remainder.' },
  numsentence: { icon: '🧩', title: 'Number Sentences', desc: 'Find the missing number in a number sentence.' },
  tables: { icon: '📐', title: 'Times Tables Blitz', desc: 'Pick which tables to drill, then answer fast.' },
  comparefrac: { icon: '🍕', title: 'Compare Fractions', desc: 'Which fraction is bigger? Use the picture to decide.' },
  addfrac: { icon: '🍰', title: 'Add and Subtract Fractions', desc: 'Same denominator fractions, with instant checking.' },
  length: { icon: '📏', title: 'Length', desc: 'Convert millimetres, centimetres, metres and kilometres.' },
  capacity: { icon: '🧃', title: 'Capacity and Volume', desc: 'Convert millilitres and litres.' },
  mass: { icon: '🏋️', title: 'Mass', desc: 'Convert grams and kilograms.' },
  time: { icon: '🕐', title: 'Time', desc: 'Read the clock and solve time problems.', badge: 'Term 4 preview' },
  shapes3d: { icon: '📦', title: '3D Object Properties', desc: 'Faces, flat surfaces and curved surfaces, 8 different objects.' },
  symmetry: { icon: '🦋', title: 'Symmetry', desc: 'Does the shape have a line of symmetry where it is drawn?' },
  gridref: { icon: '🗺️', title: 'Grid References', desc: 'Locate an object using letters and numbers on a grid.', badge: 'Term 4 preview' },
  angles: { icon: '📐', title: 'Angles', desc: 'Right angle, smaller, or bigger.', badge: 'Grade 5 preview' },
  translate: { icon: '🧭', title: 'Translations', desc: 'Follow a move on the grid.', badge: 'Grade 5 preview' },
  numpattern: { icon: '🔁', title: 'Number Patterns', desc: 'Simple, medium or complex sequences.' },
  geopattern: { icon: '🔶', title: 'Growing Patterns', desc: 'Count the blocks, simple to complex.' },
};

function renderHome() {
  let html = '';
  SECTIONS.forEach(sec => {
    html += `<div class="section-heading">${sec.title}</div><div class="grid">`;
    sec.keys.forEach((key, i) => {
      const a = ACTIVITIES[key];
      const c = BEACH[i % BEACH.length];
      html += `
        <div class="tile" style="--tile-color: var(--${c}); --tile-bg: var(--${c}-light);" onclick="goTo('${key}')">
          <div class="dot">${a.icon}</div>
          <div><h3>${a.title}</h3><p>${a.desc}</p>${a.badge ? `<div class="badge">${a.badge}</div>` : ''}</div>
        </div>
      `;
    });
    html += `</div>`;
  });
  app.innerHTML = html;
}

function backBtn() {
  return `<button class="backbtn" onclick="goTo('home')">&#8592; All activities</button>`;
}
function levelNote(a) {
  return a.badge ? `<div class="levelnote">${a.badge}</div>` : '';
}

function goTo(key) {
  if (key === 'home') { renderHome(); return; }
  const builders = {
    placevalue: renderPlaceValue, compare: renderCompare, doublehalf: renderDoubleHalf, fillten: renderFillTen,
    addsub: renderAddSub, multiply: renderMultiply, divide: renderDivide, numsentence: renderNumSentence,
    tables: renderTables, comparefrac: renderCompareFrac, addfrac: renderAddFrac,
    length: renderLength, capacity: renderCapacity, mass: renderMass, time: renderTime,
    shapes3d: renderShapes3D, symmetry: renderSymmetry, gridref: renderGridRef,
    angles: renderAngles, translate: renderTranslate,
    numpattern: renderNumPattern, geopattern: renderGeoPattern,
  };
  window.scrollTo(0, 0);
  builders[key]();
}

function scoreHTML(state) {
  return `<span class="scorepill">Score: ${state.correct} of ${state.attempted}</span>`;
}

// =====================================================================
// 1. PLACE VALUE EXPLORER (4 digit numbers)
// =====================================================================
let pvState = { correct: 0, attempted: 0, answer: null };
function renderPlaceValue() {
  pvState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔢 Place Value Explorer</h2>
      <p class="subtext">What is the <em>value</em> of the highlighted digit? Not just its name, its real value in the number.</p>
      ${tutorHTML('placevalue')}
      <div id="pv-score">${scoreHTML(pvState)}</div>
      <div id="pv-question"></div>
      <div id="pv-feedback" class="feedback"></div>
    </div>
  `;
  newPVQuestion();
}
function newPVQuestion() {
  const num = randInt(1000, 9999);
  const numStr = String(num);
  const pos = randInt(0, 3);
  const digit = parseInt(numStr[pos]);
  const placeValueExp = numStr.length - 1 - pos;
  const correct = digit * Math.pow(10, placeValueExp);
  pvState.answer = correct;
  const display = numStr.split('').map((d, i) => i === pos ? `<span style="color:#E11D48; text-decoration:underline;">${d}</span>` : d).join('');
  let options = [correct, digit, correct + Math.pow(10, placeValueExp), Math.max(1, correct - Math.pow(10, placeValueExp))];
  options = [...new Set(options)];
  while (options.length < 4) options.push(correct + randInt(1, 9));
  const finalOpts = shuffle(options.slice(0, 4));
  document.getElementById('pv-question').innerHTML = `
    <div class="q-box">In the number <strong>${display}</strong>, what is the value of the underlined digit?</div>
    <div class="mcq-opts">${finalOpts.map(o => `<div class="mcq-opt" onclick="checkPV(this, ${o})">${o.toLocaleString('en-ZA').replace(/,/g,' ')}</div>`).join('')}</div>
    <button class="secondary small" onclick="newPVQuestion()">Skip, new number</button>
  `;
  document.getElementById('pv-feedback').className = 'feedback';
}
function checkPV(el, val) {
  pvState.attempted++;
  const opts = document.querySelectorAll('#pv-question .mcq-opt');
  const fb = document.getElementById('pv-feedback');
  if (val === pvState.answer) {
    pvState.correct++;
    el.classList.add('correct');
    fb.className = 'feedback good';
    fb.textContent = 'Yes, that is right! New question loading.';
    opts.forEach(o => o.onclick = null);
    setTimeout(newPVQuestion, 1100);
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The correct value is ${pvState.answer.toLocaleString('en-ZA').replace(/,/g,' ')}. Look at which column that digit sits in.`;
    opts.forEach(o => o.onclick = null);
  }
  document.getElementById('pv-score').innerHTML = scoreHTML(pvState);
}

// =====================================================================
// 2. COMPARE AND ORDER
// =====================================================================

      </div>
      <div id="dv-score">${scoreHTML(dvState)}</div>

    </div>

function setDVMode(m) { dvState.mode = m; markDVMode(); newDVQuestion(); }
function markDVMode() {
  document.getElementById('dv-mode-exact').classList.toggle('correct', dvState.mode === 'exact');
  document.getElementById('dv-mode-rem').classList.toggle('correct', dvState.mode === 'remainder');
}
function newDVQuestion() {
  const divisor = randInt(2, 9);
  let quotient, dividend, remainder = 0;
  if (dvState.mode === 'exact') {
    do { quotient = randInt(12, 99); dividend = divisor * quotient; } while (dividend < 100 || dividend > 999);
  } else {
    do {
      quotient = randInt(12, 99);
      remainder = randInt(1, divisor - 1);
      dividend = divisor * quotient + remainder;
    } while (dividend < 100 || dividend > 999);
  }
  dvState.answer = quotient; dvState.remainder = remainder;
  document.getElementById('dv-question').innerHTML = `
    <div class="q-box">${dividend} &divide; ${divisor} = ___ ${dvState.mode === 'remainder' ? 'remainder ___' : ''}</div>
    Answer: <input type="number" id="dv-in" autofocus style="width:80px;" />
    ${dvState.mode === 'remainder' ? 'Remainder: <input type="number" id="dv-rem" style="width:80px;" />' : ''}
    <button class="action" onclick="checkDV()">Check</button>
    <button class="secondary" onclick="newDVQuestion()">Skip</button>
  `;
  document.getElementById('dv-feedback').className = 'feedback';
  const inputEl = document.getElementById('dv-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') checkDV(); });
}
function checkDV() {
  const v = parseInt(document.getElementById('dv-in').value);
  const remEl = document.getElementById('dv-rem');
  const r = remEl ? parseInt(remEl.value) : 0;
  dvState.attempted++;
  const fb = document.getElementById('dv-feedback');
  const ok = dvState.mode === 'exact' ? (v === dvState.answer) : (v === dvState.answer && r === dvState.remainder);
  if (ok) {
    dvState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(newDVQuestion, 900);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = dvState.mode === 'exact' ? `Not quite. The answer was ${dvState.answer}.` : `Not quite. The answer was ${dvState.answer} remainder ${dvState.remainder}.`;
  }
  document.getElementById('dv-score').innerHTML = scoreHTML(dvState);
}

let tmState = { correct: 0, attempted: 0, answerMin: null, mode: 'read' };
function clockSVG(h, m) {
  const hourAngle = (h % 12) * 30 + m * 0.5;
  const minAngle = m * 6;
  const cx = 60, cy = 60, r = 54;
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const ang = i * 30 * Math.PI / 180;
    const x1 = cx + (r - 6) * Math.sin(ang), y1 = cy - (r - 6) * Math.cos(ang);
    const x2 = cx + r * Math.sin(ang), y2 = cy - r * Math.cos(ang);
    ticks.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0284C7" stroke-width="2"/>`);
  }
  const hx = cx + 28 * Math.sin(hourAngle * Math.PI / 180), hy = cy - 28 * Math.cos(hourAngle * Math.PI / 180);
  const mx = cx + 42 * Math.sin(minAngle * Math.PI / 180), my = cy - 42 * Math.cos(minAngle * Math.PI / 180);
  return `<svg width="140" height="140" viewBox="0 0 120 120">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#075985" stroke-width="3"/>
    ${ticks.join('')}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#075985" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#075985"/>
  </svg>`;
}
function renderTime() {
  tmState = { correct: 0, attempted: 0, answerMin: null, mode: 'read' };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🕐 Time</h2>
      ${levelNote(ACTIVITIES.time)}
      <p class="subtext">Read the clock, or work out how much time has passed.</p>
      ${tutorHTML('time')}
      <div class="mcq-opts">
        <div class="mcq-opt" id="tm-mode-read" onclick="setTMMode('read')">Read the clock</div>
        <div class="mcq-opt" id="tm-mode-elapsed" onclick="setTMMode('elapsed')">Elapsed time</div>
      </div>
      <div id="tm-score">${scoreHTML(tmState)}</div>
      <div id="tm-question"></div>
      <div id="tm-feedback" class="feedback"></div>
    </div>
  `;
  markTMMode();
  newTMQuestion();
}
function setTMMode(m) { tmState.mode = m; markTMMode(); newTMQuestion(); }
function markTMMode() {
  document.getElementById('tm-mode-read').classList.toggle('correct', tmState.mode === 'read');
  document.getElementById('tm-mode-elapsed').classList.toggle('correct', tmState.mode === 'elapsed');
}
function newTMQuestion() {
  if (tmState.mode === 'read') {
    const h = randInt(1, 12), m = pick([0,5,10,15,20,25,30,35,40,45,50,55]);
    tmState.answerMin = h * 60 + m; // encode for exact matching, but we ask for hour and minute separately
    tmState.h = h; tmState.m = m;
    document.getElementById('tm-question').innerHTML = `
      <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
        ${clockSVG(h, m)}
        <div>
          Hour: <input type="number" id="tm-h" style="width:70px;" min="1" max="12" />
          Minutes: <input type="number" id="tm-m" style="width:70px;" min="0" max="59" />
        </div>
      </div>
      <button class="action" onclick="checkTM()">Check</button>
      <button class="secondary" onclick="newTMQuestion()">New time</button>
    `;
  } else {
    const startH = randInt(1, 11), startM = pick([0,15,30,45]);
    const durMin = pick([15,20,30,45,60,90,120]);
    let totalStart = startH * 60 + startM;
    tmState.answerMin = durMin;
    tmState.startText = `${startH}:${String(startM).padStart(2,'0')}`;
    const endTotal = totalStart + durMin;
    const endH = Math.floor(endTotal / 60) % 12 || 12;
    const endM = endTotal % 60;
    tmState.endText = `${endH}:${String(endM).padStart(2,'0')}`;
    document.getElementById('tm-question').innerHTML = `
      <div class="q-box">A movie starts at ${tmState.startText} and ends at ${tmState.endText}. How many minutes long is the movie?</div>
      <input type="number" id="tm-elapsed" autofocus />
      <button class="action" onclick="checkTM()">Check</button>
      <button class="secondary" onclick="newTMQuestion()">New question</button>
    `;
  }
  document.getElementById('tm-feedback').className = 'feedback';
}
function checkTM() {
  const fb = document.getElementById('tm-feedback');
  tmState.attempted++;
  if (tmState.mode === 'read') {
    const h = parseInt(document.getElementById('tm-h').value);
    const m = parseInt(document.getElementById('tm-m').value);
    if (h === tmState.h && m === tmState.m) {
      tmState.correct++;
      fb.className = 'feedback good';
      fb.textContent = 'Correct! Next one.';
      setTimeout(newTMQuestion, 900);
    } else {
      fb.className = 'feedback bad';
      fb.textContent = `Not quite. The clock shows ${tmState.h}:${String(tmState.m).padStart(2,'0')}.`;
    }
  } else {
    const v = parseInt(document.getElementById('tm-elapsed').value);
    if (v === tmState.answerMin) {
      tmState.correct++;
      fb.className = 'feedback good';
      fb.textContent = 'Correct! Next one.';
      setTimeout(newTMQuestion, 900);
    } else {
      fb.className = 'feedback bad';
      fb.textContent = `Not quite. The movie was ${tmState.answerMin} minutes long.`;
    }
  }
  document.getElementById('tm-score').innerHTML = scoreHTML(tmState);
}

function newTRQuestion() {
  const size = 6;
  const startCol = randInt(0, size - 1), startRow = randInt(0, size - 1);
  let dCol, dRow, tries = 0;
  do {
    dCol = randInt(-3, 3); dRow = randInt(-3, 3);
    tries++;
  } while ((dCol === 0 && dRow === 0 || startCol + dCol < 0 || startCol + dCol >= size || startRow + dRow < 0 || startRow + dRow >= size) && tries < 200);
  trState = { ...trState, startCol, startRow, dCol, dRow, size, picked: null };
  const rightText = dCol > 0 ? `${dCol} right` : (dCol < 0 ? `${-dCol} left` : '');
  const vertText = dRow > 0 ? `${dRow} up` : (dRow < 0 ? `${-dRow} down` : '');
  const instr = [rightText, vertText].filter(Boolean).join(' and ');
  let html = `<div class="posgrid" id="tr-grid" style="grid-template-columns: repeat(${size}, 42px);">`;
  for (let rr = size - 1; rr >= 0; rr--) {
    for (let cc = 0; cc < size; cc++) {
      const isStart = cc === startCol && rr === startRow;
      html += `<div class="pcell clickable ${isStart ? 'start' : ''}" data-col="${cc}" data-row="${rr}" onclick="pickTR(this, ${cc}, ${rr})">${isStart ? '⭐' : ''}</div>`;
    }
  }
  html += '</div>';
  document.getElementById('tr-question').innerHTML = `
    <div class="q-box">Move the star ${instr}. Click the square it lands on.</div>
    ${html}
    <button class="action" onclick="checkTR()">Check</button>
    <button class="secondary" onclick="newTRQuestion()">New move</button>
  `;
  document.getElementById('tr-feedback').className = 'feedback';
}
function pickTR(el, c, r) {
  document.querySelectorAll('#tr-grid .pcell').forEach(p => p.classList.remove('picked'));
  el.classList.add('picked');
  trState.picked = { c, r };
}
function checkTR() {
  trState.attempted++;
  const fb = document.getElementById('tr-feedback');
  const targetCol = trState.startCol + trState.dCol, targetRow = trState.startRow + trState.dRow;
  if (!trState.picked) {
    fb.className = 'feedback info';
    fb.textContent = 'Click a square on the grid first.';
    return;
  }
  if (trState.picked.c === targetCol && trState.picked.r === targetRow) {
    trState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next move.';
    setTimeout(newTRQuestion, 1000);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = 'Not quite. Count the squares again, one at a time, in each direction.';
  }
  document.getElementById('tr-score').innerHTML = scoreHTML(trState);
}

// =====================================================================
// 21. NUMBER PATTERNS
// =====================================================================
let npState = { answer: null, correct: 0, attempted: 0, level: 'simple' };
function renderNumPattern() {
  npState = { answer: null, correct: 0, attempted: 0, level: 'simple' };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔁 Number Patterns</h2>
      <p class="subtext">Work out the rule, then find the next number in the sequence.</p>
      ${tutorHTML('numpattern')}
      <div class="mcq-opts">
        <div class="mcq-opt" id="np-lvl-simple" onclick="setNPLevel('simple')">Simple</div>
        <div class="mcq-opt" id="np-lvl-medium" onclick="setNPLevel('medium')">Medium</div>
        <div class="mcq-opt" id="np-lvl-complex" onclick="setNPLevel('complex')">Complex</div>
      </div>
      <div id="np-score">${scoreHTML(npState)}</div>
      <div id="np-question"></div>
      <div id="np-feedback" class="feedback"></div>
    </div>
  `;
  markNPLevel();
  newNPQuestion();
}
function setNPLevel(l) { npState.level = l; markNPLevel(); newNPQuestion(); }
function markNPLevel() {
  ['simple','medium','complex'].forEach(l => document.getElementById('np-lvl-' + l).classList.toggle('correct', npState.level === l));
}
function newNPQuestion() {
  let seq = [];
  if (npState.level === 'simple') {
    const start = randInt(1, 30), step = randInt(1, 5);
    const down = Math.random() < 0.4;
    seq = [0,1,2,3,4].map(i => down ? start + (30 - start > 0 ? 40 : 0) - i * step : start + i * step);
    if (down) { const s2 = randInt(60, 99); seq = [0,1,2,3,4].map(i => s2 - i * step); }
  } else if (npState.level === 'medium') {
    const type = pick(['add', 'subtract', 'multiply']);
    if (type === 'add') { const start = randInt(1, 50), step = randInt(6, 15); seq = [0,1,2,3,4].map(i => start + i * step); }
    else if (type === 'subtract') { const start = randInt(80, 200), step = randInt(6, 15); seq = [0,1,2,3,4].map(i => start - i * step); }
    else { const start = randInt(1, 5), step = 2; seq = [0,1,2,3,4].map(i => start * Math.pow(step, i)); }
  } else {
    const type = pick(['multiply3', 'increasingdiff', 'twostep']);
    if (type === 'multiply3') { const start = randInt(1, 4); seq = [0,1,2,3,4].map(i => start * Math.pow(3, i)); }
    else if (type === 'increasingdiff') { let cur = randInt(1, 5); seq = [cur]; let d = randInt(1, 3); for (let i = 0; i < 4; i++) { cur += d; seq.push(cur); d += 1; } }
    else { let cur = randInt(1, 6); seq = [cur]; for (let i = 0; i < 4; i++) { cur = cur * 2 + 1; seq.push(cur); } }
  }
  npState.answer = seq[4];
  document.getElementById('np-question').innerHTML = `
    <div class="q-box">${seq.slice(0,4).join(', ')}, <input type="number" id="np-in" style="width:90px;" autofocus /></div>
    <button class="action" onclick="checkNP()">Check</button>
    <button class="secondary" onclick="newNPQuestion()">New pattern</button>
  `;
  document.getElementById('np-feedback').className = 'feedback';
  const inputEl = document.getElementById('np-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') checkNP(); });
}
function checkNP() {
  const v = parseInt(document.getElementById('np-in').value);
  npState.attempted++;
  const fb = document.getElementById('np-feedback');
  if (v === npState.answer) {
    npState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(newNPQuestion, 1000);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The next number was ${npState.answer}.`;
  }
  document.getElementById('np-score').innerHTML = scoreHTML(npState);
}

// =====================================================================
// 22. GROWING (GEOMETRIC) PATTERNS
// =====================================================================
let gpState = { type: null, answer: null, correct: 0, attempted: 0, level: 'simple' };
function patternCount(type, n) {
  if (type === 'triangle') return n * (n + 1) / 2;
  if (type === 'square') return n * n;
  if (type === 'staircase') return 2 * n - 1;
  if (type === 'cross') return 4 * n - 3;
  if (type === 'hollow') return n === 1 ? 1 : 4 * (n - 1);
  return n;
}
function renderPatternStep(type, n) {
  let html = '';
  if (type === 'square') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let i = 0; i < n * n; i++) html += '<div class="blk on"></div>';
    html += '</div>';
  } else if (type === 'triangle') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 1; r <= n; r++) for (let c = 1; c <= n; c++) html += `<div class="blk ${c <= r ? 'on' : ''}" style="visibility:${c <= r ? 'visible' : 'hidden'};"></div>`;
    html += '</div>';
  } else if (type === 'staircase') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) html += `<div class="blk ${(r === 0 || c === 0) ? 'on' : ''}"></div>`;
    html += '</div>';
  } else if (type === 'cross') {
    const size = 2 * n - 1;
    const mid = n - 1;
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${size}, 22px);">`;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) html += `<div class="blk ${(r === mid || c === mid) ? 'on' : ''}"></div>`;
    html += '</div>';
  } else if (type === 'hollow') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const on = r === 0 || c === 0 || r === n - 1 || c === n - 1; html += `<div class="blk ${on ? 'on' : ''}"></div>`; }
    html += '</div>';
  }
  return html;
}
function renderGeoPattern() {
  gpState = { type: null, answer: null, correct: 0, attempted: 0, level: 'simple' };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔶 Growing Patterns</h2>
      <p class="subtext">Count the blocks in each step. How many blocks will the next step have?</p>
      ${tutorHTML('geopattern')}
      <div class="mcq-opts">
        <div class="mcq-opt" id="gp-lvl-simple" onclick="setGPLevel('simple')">Simple</div>
        <div class="mcq-opt" id="gp-lvl-medium" onclick="setGPLevel('medium')">Medium</div>
        <div class="mcq-opt" id="gp-lvl-complex" onclick="setGPLevel('complex')">Complex</div>
      </div>
      <div id="gp-score">${scoreHTML(gpState)}</div>
      <div id="gp-question"></div>
      <div id="gp-feedback" class="feedback"></div>
    </div>
  `;
  markGPLevel();
  newGPQuestion();
}
function setGPLevel(l) { gpState.level = l; markGPLevel(); newGPQuestion(); }
function markGPLevel() {
  ['simple','medium','complex'].forEach(l => document.getElementById('gp-lvl-' + l).classList.toggle('correct', gpState.level === l));
}
function newGPQuestion() {
  const pools = { simple: ['staircase'], medium: ['triangle', 'square'], complex: ['cross', 'hollow'] };
  gpState.type = pick(pools[gpState.level]);
  const nextStep = 4;
  gpState.answer = patternCount(gpState.type, nextStep);
  const stepsHTML = [1,2,3].map(n => `
    <div class="pattern-step">
      ${renderPatternStep(gpState.type, n)}
      <div class="count">Step ${n}: ${patternCount(gpState.type, n)}</div>
    </div>
  `).join('');
  document.getElementById('gp-question').innerHTML = `
    <div>${stepsHTML}</div>
    <div class="q-box">How many blocks will step 4 have? <input type="number" id="gp-in" style="width:90px;" /></div>
    <button class="action" onclick="checkGP()">Check</button>
    <button class="secondary" onclick="newGPQuestion()">New pattern</button>
  `;
  document.getElementById('gp-feedback').className = 'feedback';
}
function checkGP() {
  const v = parseInt(document.getElementById('gp-in').value);
  gpState.attempted++;
  const fb = document.getElementById('gp-feedback');
  if (v === gpState.answer) {
    gpState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(newGPQuestion, 1100);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. Step 4 has ${gpState.answer} blocks. Try counting step 3 again and see how many more are added.`;
  }
  document.getElementById('gp-score').innerHTML = scoreHTML(gpState);
}
