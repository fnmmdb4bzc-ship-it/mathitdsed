function g4_svgPoint(svg, evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  return { x: loc.x, y: loc.y };
}
function g4_attachSYHandlers() {
  const svg = document.getElementById('sy-svg');
  const drawnLine = document.getElementById('sy-drawn-line');
  if (!svg) return;
  const onDown = (evt) => {
    if (g4_syState.checked) return;
    evt.preventDefault();
    svg.setPointerCapture(evt.pointerId);
    const p = g4_svgPoint(svg, evt);
    g4_syState.drag = { startX: p.x, startY: p.y, endX: p.x, endY: p.y };
    drawnLine.style.display = 'block';
    drawnLine.setAttribute('x1', p.x); drawnLine.setAttribute('y1', p.y);
    drawnLine.setAttribute('x2', p.x); drawnLine.setAttribute('y2', p.y);
  };
  const onMove = (evt) => {
    if (!g4_syState.drag || g4_syState.checked) return;
    evt.preventDefault();
    const p = g4_svgPoint(svg, evt);
    g4_syState.drag.endX = p.x; g4_syState.drag.endY = p.y;
    drawnLine.setAttribute('x2', p.x); drawnLine.setAttribute('y2', p.y);
  };
  const onUp = (evt) => {
    if (g4_syState.drag) evt.preventDefault();
  };
  svg.onpointerdown = onDown;
  svg.onpointermove = onMove;
  svg.onpointerup = onUp;
  svg.onpointercancel = onUp;
}
function g4_clearSYLine() {
  if (g4_syState.checked) return;
  g4_syState.drag = null;
  const drawnLine = document.getElementById('sy-drawn-line');
  if (drawnLine) drawnLine.style.display = 'none';
  const fb = document.getElementById('sy-feedback');
  fb.className = 'feedback';
  fb.textContent = '';
}
function g4_checkSYLine() {
  const fb = document.getElementById('sy-feedback');
  const drag = g4_syState.drag;
  if (g4_syState.checked) return;
  if (!drag) {
    fb.className = 'feedback bad';
    fb.textContent = tr('Draw a line across the shape first, then tap "Check my line".', 'Trek eers \'n lyn oor die vorm, en tik dan op "Gaan my lyn na".');
    return;
  }
  const dx = drag.endX - drag.startX;
  const dy = drag.endY - drag.startY;
  const dragLength = Math.sqrt(dx * dx + dy * dy);
  if (dragLength < 60) {
    fb.className = 'feedback bad';
    fb.textContent = tr('That line is too short. Drag right across the whole shape.', 'Daardie lyn is te kort. Sleep reg oor die hele vorm.');
    return;
  }
  g4_syState.attempted++;
  g4_syState.checked = true;
  const shape = g4_syState.shape;
  const angle = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
  const angleFromVertical = Math.min(Math.abs(angle - 90), Math.abs(angle - 270));
  const angleFromHorizontal = Math.min(angle, Math.abs(angle - 180), Math.abs(angle - 360));
  const ANGLE_TOL = 18;
  const POS_TOL = 26;
  let ok = false;
  if (shape.axis === 'v' && angleFromVertical <= ANGLE_TOL) {
    const dTop = Math.min(
      Math.hypot(drag.startX - shape.axisA[0], drag.startY - shape.axisA[1]),
      Math.hypot(drag.endX - shape.axisA[0], drag.endY - shape.axisA[1])
    );
    const dBot = Math.min(
      Math.hypot(drag.startX - shape.axisB[0], drag.startY - shape.axisB[1]),
      Math.hypot(drag.endX - shape.axisB[0], drag.endY - shape.axisB[1])
    );
    ok = dTop <= POS_TOL + 20 && dBot <= POS_TOL + 20 && Math.abs((drag.startX + drag.endX) / 2 - shape.axisA[0]) <= POS_TOL;
  } else if (shape.axis === 'h' && angleFromHorizontal <= ANGLE_TOL) {
    ok = Math.abs((drag.startY + drag.endY) / 2 - shape.axisA[1]) <= POS_TOL;
  }
  const trueLine = document.getElementById('sy-true-line');
  const opts = { class: ok ? 'feedback good' : 'feedback bad' };
  if (ok) {
    g4_syState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr('Correct! That line splits the shape into two matching mirror halves.', 'Reg! Daardie lyn verdeel die vorm in twee eendersvormige spieëlhelftes.');
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr('Not quite, look at the dashed green line below, that is the true line of symmetry. Try to picture folding the shape along it.', 'Nie heeltemal reg nie, kyk na die stippel groen lyn hieronder, dit is die ware simmetrielyn. Probeer jou voorstel hoe die vorm daarlangs vou.');
  }
  if (trueLine) trueLine.style.display = 'block';
  document.getElementById('sy-score').innerHTML = scoreHTML(g4_syState);
  setTimeout(g4_newSYQuestion, ok ? 1400 : 2600);
}

    </div>
  `;
  g4_newTRQuestion();
}
function g4_newTRQuestion() {
  const size = 6;
  const startCol = randInt(0, size - 1), startRow = randInt(0, size - 1);
  let dCol, dRow, tries = 0;
  do {
    dCol = randInt(-3, 3); dRow = randInt(-3, 3);
    tries++;
  } while ((dCol === 0 && dRow === 0 || startCol + dCol < 0 || startCol + dCol >= size || startRow + dRow < 0 || startRow + dRow >= size) && tries < 200);
  g4_trState = { ...g4_trState, startCol, startRow, dCol, dRow, size, picked: null };
  const rightText = dCol > 0 ? tr(`${dCol} right`, `${dCol} regs`) : (dCol < 0 ? tr(`${-dCol} left`, `${-dCol} links`) : '');
  const vertText = dRow > 0 ? tr(`${dRow} up`, `${dRow} op`) : (dRow < 0 ? tr(`${-dRow} down`, `${-dRow} af`) : '');
  const instr = [rightText, vertText].filter(Boolean).join(tr(' and ', ' en '));
  let html = `<div class="posgrid" id="tr-grid" style="grid-template-columns: repeat(${size}, 42px);">`;
  for (let rr = size - 1; rr >= 0; rr--) {
    for (let cc = 0; cc < size; cc++) {
      const isStart = cc === startCol && rr === startRow;
      html += `<div class="pcell clickable ${isStart ? 'start' : ''}" data-col="${cc}" data-row="${rr}" onclick="g4_pickTR(this, ${cc}, ${rr})">${isStart ? '⭐' : ''}</div>`;
    }
  }
  html += '</div>';
  document.getElementById('tr-question').innerHTML = `
    <div class="q-box">${tr(`Move the star ${instr}. Click the square it lands on.`, `Skuif die ster ${instr}. Klik op die blokkie waar dit land.`)}</div>
    ${html}
    <button class="action" onclick="g4_checkTR()">${tr('Check', 'Gaan na')}</button>
    <button class="secondary" onclick="g4_newTRQuestion()">${tr('New move', 'Nuwe skuif')}</button>
  `;
  document.getElementById('tr-feedback').className = 'feedback';
}
function g4_pickTR(el, c, r) {
  document.querySelectorAll('#tr-grid .pcell').forEach(p => p.classList.remove('picked'));
  el.classList.add('picked');
  g4_trState.picked = { c, r };
}
function g4_checkTR() {
  g4_trState.attempted++;
  const fb = document.getElementById('tr-feedback');
  const targetCol = g4_trState.startCol + g4_trState.dCol, targetRow = g4_trState.startRow + g4_trState.dRow;
  if (!g4_trState.picked) {
    fb.className = 'feedback info';
    fb.textContent = tr('Click a square on the grid first.', 'Klik eers op \'n blokkie op die rooster.');
    return;
  }
  if (g4_trState.picked.c === targetCol && g4_trState.picked.r === targetRow) {
    g4_trState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr('Correct! Next move.', 'Reg! Volgende skuif.');
    setTimeout(g4_newTRQuestion, 1000);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr('Not quite. Count the squares again, one at a time, in each direction.', "Nie heeltemal reg nie. Tel die blokkies weer, een op 'n slag, in elke rigting.");
  }
  document.getElementById('tr-score').innerHTML = scoreHTML(g4_trState);
}

function g4_setNPLevel(l) { g4_npState.level = l; g4_markNPLevel(); g4_newNPQuestion(); }
function g4_markNPLevel() {
  ['simple','medium','complex'].forEach(l => document.getElementById('np-lvl-' + l).classList.toggle('correct', g4_npState.level === l));
}
function g4_newNPQuestion() {
  let seq = [];
  if (g4_npState.level === 'simple') {
    const start = randInt(1, 30), step = randInt(1, 5);
    const down = Math.random() < 0.4;
    seq = [0,1,2,3,4].map(i => down ? start + (30 - start > 0 ? 40 : 0) - i * step : start + i * step);
    if (down) { const s2 = randInt(60, 99); seq = [0,1,2,3,4].map(i => s2 - i * step); }
  } else if (g4_npState.level === 'medium') {
    const type = pick(['add', 'subtract', 'multiply']);
    if (type === 'add') { const start = randInt(1, 50), step = randInt(6, 15); seq = [0,1,2,3,4].map(i => start + i * step); }
    else if (type === 'subtract') { const start = randInt(80, 200), step = randInt(6, 15); seq = [0,1,2,3,4].map(i => start - i * step); }
    else { const start = randInt(1, 5), step = 2; seq = [0,1,2,3,4].map(i => start * Math.pow(step, i)); }
  } else {
    const type = pick(['multiply3', 'increasingdiff', 'twostep']);
    if (type === 'multiply3') { const start = randInt(1, 4); seq = [0,1,2,3,4].map(i => start * Math.pow(3, i)); }
    else if (type === 'increasingdiff') { let cur = randInt(1, 5); seq = [cur]; let d = randInt(1, 3); for (let i = 0; i < 4; i++) { cur += d; seq.push(cur); d += 1; } }
    else { let cur = randInt(1, 6); seq = [cur]; for (let i = 0; i < 4; i++) { cur = cur * 2 + 1; seq.push(cur); } }
  }
  g4_npState.answer = seq[4];
  document.getElementById('np-question').innerHTML = `
    <div class="q-box">${seq.slice(0,4).join(', ')}, <input type="number" id="np-in" style="width:90px;" autofocus /></div>

  `;
  document.getElementById('np-feedback').className = 'feedback';
  const inputEl = document.getElementById('np-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g4_checkNP(); });
}

  const v = parseInt(document.getElementById('np-in').value);

    g4_npState.correct++;

    fb.textContent = tr('Correct! Next one.', 'Reg! Volgende een.');
    setTimeout(g4_newNPQuestion, 1000);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The next number was ${g4_npState.answer}.`, `Nie heeltemal reg nie. Die volgende getal was ${g4_npState.answer}.`);
  }
  document.getElementById('np-score').innerHTML = scoreHTML(g4_npState);
}

let g4_gpState = { type: null, answer: null, correct: 0, attempted: 0, level: 'simple' };
function g4_patternCount(type, n) {
  if (type === 'triangle') return n * (n + 1) / 2;
  if (type === 'square') return n * n;
  if (type === 'staircase') return 2 * n - 1;
  if (type === 'cross') return 4 * n - 3;
  if (type === 'hollow') return n === 1 ? 1 : 4 * (n - 1);
  return n;
}
function g4_renderPatternStep(type, n) {
  let html = '';
  if (type === 'square') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let i = 0; i < n * n; i++) html += '<div class="blk on"></div>';
    html += '</div>';
  } else if (type === 'triangle') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 1; r <= n; r++) for (let c = 1; c <= n; c++) html += `<div class="blk ${c <= r ? 'on' : ''}" style="visibility:${c <= r ? 'visible' : 'hidden'};"></div>`;
    html += '</div>';
  } else if (type === 'staircase') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) html += `<div class="blk ${(r === 0 || c === 0) ? 'on' : ''}"></div>`;
    html += '</div>';
  } else if (type === 'cross') {
    const size = 2 * n - 1;
    const mid = n - 1;
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${size}, 22px);">`;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) html += `<div class="blk ${(r === mid || c === mid) ? 'on' : ''}"></div>`;
    html += '</div>';
  } else if (type === 'hollow') {
    html = `<div class="pattern-grid" style="grid-template-columns: repeat(${n}, 22px);">`;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const on = r === 0 || c === 0 || r === n - 1 || c === n - 1; html += `<div class="blk ${on ? 'on' : ''}"></div>`; }
    html += '</div>';
  }
  return html;
}
function g4_renderGeoPattern() {
  g4_gpState = { type: null, answer: null, correct: 0, attempted: 0, level: 'simple' };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔶 Growing Patterns</h2>
      <p class="subtext">Count the blocks in each step. How many blocks will the next step have?</p>
      ${tutorHTML('g4_geopattern')}
      <div class="mcq-opts">
        <div class="mcq-opt" id="gp-lvl-simple" onclick="g4_setGPLevel('simple')">Simple</div>
        <div class="mcq-opt" id="gp-lvl-medium" onclick="g4_setGPLevel('medium')">Medium</div>
        <div class="mcq-opt" id="gp-lvl-complex" onclick="g4_setGPLevel('complex')">Complex</div>
      </div>
      <div id="gp-score">${scoreHTML(g4_gpState)}</div>
      <div id="gp-question"></div>
      <div id="gp-feedback" class="feedback"></div>
    </div>
  `;
  g4_markGPLevel();
  g4_newGPQuestion();
}
function g4_setGPLevel(l) { g4_gpState.level = l; g4_markGPLevel(); g4_newGPQuestion(); }
function g4_markGPLevel() {
  ['simple','medium','complex'].forEach(l => document.getElementById('gp-lvl-' + l).classList.toggle('correct', g4_gpState.level === l));
}
function g4_newGPQuestion() {
  const pools = { simple: ['staircase'], medium: ['triangle', 'square'], complex: ['cross', 'hollow'] };
  g4_gpState.type = pick(pools[g4_gpState.level]);
  const nextStep = 4;

  const stepsHTML = [1,2,3].map(n => `
    <div class="pattern-step">

    </div>
  `).join('');
  document.getElementById('gp-question').innerHTML = `

    <button class="action" onclick="g4_checkGP()">${tr('Check', 'Gaan na')}</button>
    <button class="secondary" onclick="g4_newGPQuestion()">${tr('New pattern', 'Nuwe patroon')}</button>
  `;
  document.getElementById('gp-feedback').className = 'feedback';
}
function g4_checkGP() {
  const v = parseInt(document.getElementById('gp-in').value);
  g4_gpState.attempted++;
  const fb = document.getElementById('gp-feedback');
  if (v === g4_gpState.answer) {
    g4_gpState.correct++;

function g4_newDBQuestion() {
  const theme = pick(G4_DH_THEMES);

  if (qType === 'most') { text = tr('Which category has the most?', 'Watter kategorie het die meeste?'); answer = theme.labels[maxIdx]; }
  else if (qType === 'least') { text = tr('Which category has the fewest?', 'Watter kategorie het die minste?'); answer = theme.labels[minIdx]; }

    text = tr(`How many more chose "${theme.labels[a]}" than "${theme.labels[b]}"?`, `Hoeveel meer het "${g4_dhLbl(theme, theme.labels[a])}" as "${g4_dhLbl(theme, theme.labels[b])}" gekies?`);

        }).join('')}
      </div>
    `;
  }
  const options = qType === 'most' || qType === 'least'

    : shuffle([...new Set([answer, String(Number(answer) + 1), String(Math.max(0, Number(answer) - 1)), String(Number(answer) + 2)])]).slice(0, 4);
  const isLabelOptions = qType === 'most' || qType === 'least';
  document.getElementById('g4db-question').innerHTML = `
    <div>${vizHTML}</div>
    <div class="q-box">${text}</div>
    <div class="mcq-opts">${options.map(o => `<div class="mcq-opt" onclick="g4_checkDB(this, '${o}')">${isLabelOptions ? g4_dhLbl(theme, o) : o}</div>`).join('')}</div>
    <button class="secondary small" onclick="g4_newDBQuestion()">${tr('New survey', 'Nuwe opname')}</button>
  `;
  document.getElementById('g4db-feedback').className = 'feedback';
}

function g5_newPVQuestion() {
  const digits = pick([5, 6]);
  const num = randInt(Math.pow(10, digits - 1), Math.pow(10, digits) - 1);
  const numStr = String(num);
  const pos = randInt(0, numStr.length - 1);
  const digit = parseInt(numStr[pos]);
  const placeValueExp = numStr.length - 1 - pos;
  const correct = digit * Math.pow(10, placeValueExp);
  g5_pvState.answer = correct;
  const display = numStr.split('').map((d, i) => i === pos ? `<span style="color:#E11D48; text-decoration:underline;">${d}</span>` : d).join('');
  let options = [correct, digit, correct + Math.pow(10, placeValueExp), Math.max(1, correct - Math.pow(10, placeValueExp))];
  options = [...new Set(options)];
  while (options.length < 4) options.push(correct + randInt(1, 9));
  const finalOpts = shuffle(options.slice(0, 4));
  document.getElementById('g5pv-question').innerHTML = `
    <div class="q-box">${tr(`In the number <strong>${display}</strong>, what is the value of the underlined digit?`, `In die getal <strong>${display}</strong>, wat is die waarde van die onderstreepte syfer?`)}</div>

let g5_fmState = { den: 0, wholeAns: 0, fracAns: 0, correct: 0, attempted: 0 };
function g5_renderFracMixed() {
  g5_fmState = { den: 0, wholeAns: 0, fracAns: 0, correct: 0, attempted: 0 };
  app.innerHTML = `

    <div class="card">

      <p class="subtext">${tr('Same denominator throughout. Type your answer as a mixed number, for example 1 2/5, or just a fraction like 4/5 if it is less than 1, or a whole number like 2 if there is no fraction left.', 'Dieselfde noemer regdeur. Tik jou antwoord as \'n gemengde getal, byvoorbeeld 1 2/5, of net \'n breuk soos 4/5 as dit minder as 1 is, of \'n heelgetal soos 2 as daar geen breuk oor is nie.')}</p>
      ${tutorHTML('g5_fracmixed')}
      <div id="g5fm-score">${scoreHTML(g5_fmState)}</div>
      <div id="g5fm-question"></div>
      <div id="g5fm-feedback" class="feedback"></div>
    </div>
  `;
  g5_newFMQuestion();
}
function g5_mixedText(w, n, d) {
  if (n === 0) return `${w}`;
  return w > 0 ? `${w} ${n}/${d}` : `${n}/${d}`;
}
function g5_newFMQuestion() {
  const den = pick([3,4,5,6,8]);
  const isAdd = Math.random() < 0.5;
  const w1 = randInt(0, 2), n1 = randInt(0, den - 1);
  let w2, n2;
  const imp1 = w1 * den + n1;
  let totalImp;
  if (isAdd) {
    w2 = randInt(0, 2); n2 = randInt(0, den - 1);
    totalImp = imp1 + (w2 * den + n2);
  } else {
    // ensure operand1 >= operand2 so the result stays non negative
    do { w2 = randInt(0, w1); n2 = randInt(0, den - 1); } while (w2 * den + n2 > imp1);
    totalImp = imp1 - (w2 * den + n2);
  }
  g5_fmState.den = den;
  g5_fmState.wholeAns = Math.floor(totalImp / den);
  g5_fmState.fracAns = totalImp % den;
  document.getElementById('g5fm-question').innerHTML = `
    <div class="q-box">${g5_mixedText(w1, n1, den)} ${isAdd ? '+' : '-'} ${g5_mixedText(w2, n2, den)} = <input type="text" id="g5fm-in" placeholder="${tr(`for example 1 2/${den}`, `byvoorbeeld 1 2/${den}`)}" style="width:120px;" /></div>
    <button class="action" onclick="g5_checkFM()">${tr('Check', 'Gaan na')}</button>
    <button class="secondary" onclick="g5_newFMQuestion()">${tr('Skip', 'Slaan oor')}</button>
  `;
  document.getElementById('g5fm-feedback').className = 'feedback';
}
function g5_checkFM() {
  const raw = (document.getElementById('g5fm-in').value || '').trim();
  g5_fmState.attempted++;
  const fb = document.getElementById('g5fm-feedback');
  let ok = false;
  const parts = raw.split(/\s+/);
  let whole = 0, num = 0, den = null;
  if (parts.length === 2 && parts[1].includes('/')) {
    whole = parseInt(parts[0]);
    const fp = parts[1].split('/');
    num = parseInt(fp[0]); den = parseInt(fp[1]);
  } else if (parts.length === 1 && parts[0].includes('/')) {
    const fp = parts[0].split('/');
    whole = 0; num = parseInt(fp[0]); den = parseInt(fp[1]);
  } else if (parts.length === 1 && !isNaN(parseInt(parts[0]))) {
    whole = parseInt(parts[0]); num = 0; den = g5_fmState.den;
  }
  if (den !== null && !isNaN(whole) && !isNaN(num) && den !== 0) {
    const expectedImp = g5_fmState.wholeAns * g5_fmState.den + g5_fmState.fracAns;
    const gotImp = whole * den + num;
    ok = gotImp * g5_fmState.den === expectedImp * den;
  }
  const answerText = g5_mixedText(g5_fmState.wholeAns, g5_fmState.fracAns, g5_fmState.den);
  if (ok) {
    g5_fmState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr(`Correct! (${answerText}). Next one.`, `Reg! (${answerText}). Volgende een.`);
    setTimeout(g5_newFMQuestion, 1100);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The answer was ${answerText}.`, `Nie heeltemal reg nie. Die antwoord was ${answerText}.`);
  }
  document.getElementById('g5fm-score').innerHTML = scoreHTML(g5_fmState);
}

function g5_newDHQuestion() {
  const fb = document.getElementById('g5dh-feedback');
  fb.className = 'feedback';
  if (g5_dhState.mode === 'picto') {
    const theme = pick(G5_DH_THEMES);
    const key = theme.key;
    let counts;
    do { counts = theme.labels.map(() => randInt(1, 6) * key); } while (new Set(counts).size < counts.length);
    g5_dhState.data = { theme, counts };
    const qType = pick(['most', 'least', 'howmany', 'diff', 'total']);
    const maxIdx = counts.indexOf(Math.max(...counts));
    const minIdx = counts.indexOf(Math.min(...counts));
    let text, answer;
    if (qType === 'most') { text = tr('Which category has the most?', 'Watter kategorie het die meeste?'); answer = theme.labels[maxIdx]; }
    else if (qType === 'least') { text = tr('Which category has the fewest?', 'Watter kategorie het die minste?'); answer = theme.labels[minIdx]; }
    else if (qType === 'howmany') {
      const idx = randInt(0, theme.labels.length - 1);
      text = tr(`How many ${theme.unit}s does "${theme.labels[idx]}" represent?`, `Hoeveel ${theme.unitAf}s verteenwoordig "${g5_dhLbl(theme, theme.labels[idx])}"?`);
      answer = String(counts[idx]);
    } else if (qType === 'diff') {
      let a = randInt(0, theme.labels.length - 1), b = randInt(0, theme.labels.length - 1);
      while (b === a) b = randInt(0, theme.labels.length - 1);
      text = tr(`How many more does "${theme.labels[a]}" represent than "${theme.labels[b]}"?`, `Hoeveel meer verteenwoordig "${g5_dhLbl(theme, theme.labels[a])}" as "${g5_dhLbl(theme, theme.labels[b])}"?`);
      answer = String(Math.abs(counts[a] - counts[b]));
    } else {
      text = tr('What is the total across all categories?', 'Wat is die totaal oor alle kategorieë?');
      answer = String(counts.reduce((s, c) => s + c, 0));
    }
    g5_dhState.answer = answer;
    const vizHTML = `
      <p style="font-weight:700; color:var(--ocean-dark); margin-bottom:2px;">${tr(theme.title, theme.titleAf)}</p>

          <div style="letter-spacing:2px;">${Array(counts[i] / key).fill(theme.icon).join(' ')}</div>
        </div>
      `).join('')}
    `;
    const options = qType === 'most' || qType === 'least'
      ? shuffle(theme.labels)
      : shuffle([...new Set([answer, String(Number(answer) + key), String(Math.max(0, Number(answer) - key)), String(Number(answer) + 2 * key)])]).slice(0, 4);

      <button class="secondary small" onclick="g5_newDHQuestion()">${tr('New survey', 'Nuwe opname')}</button>
    `;
  } else {
    // Find the mode from a small raw data set (CAPS Grade 5: mode from ungrouped data)
    // Built so exactly one value has a strictly higher frequency than every other value, avoiding a bimodal / ambiguous "mode".
    const scenarios = [
      { label: 'shoe sizes', labelAf: 'skoenmaats', pool: [2, 3, 4, 5, 6] },
      { label: "learners' favourite colours", labelAf: 'leerders se gunsteling kleure', pool: ['Red', 'Blue', 'Green', 'Yellow'] },
      { label: 'scores out of 10 on a quiz', labelAf: 'tellings uit 10 in \'n kwissie', pool: [5, 6, 7, 8, 9, 10] },
    ];
    const G5_COLOR_AF = { Red: 'Rooi', Blue: 'Blou', Green: 'Groen', Yellow: 'Geel' };
    const g5_dhModeLbl = v => (G5_COLOR_AF[v] ? tr(v, G5_COLOR_AF[v]) : v);

    const pool = shuffle(sc.pool).slice(0, 4);

    let data = [];
    pool.forEach(v => {
      const count = v === modeVal ? modeCount : randInt(1, modeCount - 1);
      for (let i = 0; i < count; i++) data.push(v);
    });
    data = shuffle(data);
    g5_dhState.answer = String(modeVal);
    g5_dhState.dataList = data;
    const distractors = pool.filter(v => v !== modeVal).map(String);
    const options = shuffle([String(modeVal), ...distractors]);
    document.getElementById('g5dh-question').innerHTML = `

let g6_pvState = { correct: 0, attempted: 0, answer: null };
function g6_renderPlaceValue() {
  g6_pvState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">${tr('🔢 Place Value Detective', '🔢 Plekwaarde-speurder')}</h2>
      <p class="subtext">${tr('What is the <em>value</em> of the highlighted digit? Not just its name, its real value in the number.', 'Wat is die <em>waarde</em> van die uitgeligte syfer? Nie net sy naam nie, sy werklike waarde in die getal.')}</p>
      ${tutorHTML('g6_placevalue')}
      <div id="pv-score">${scoreHTML(g6_pvState)}</div>
      <div id="pv-question"></div>
      <div id="pv-feedback" class="feedback"></div>
    </div>
  `;
  g6_newPVQuestion();
}
function g6_newPVQuestion() {
  const digits = randInt(3, 5);
  let num = randInt(Math.pow(10, digits - 1), Math.pow(10, digits) - 1);
  const numStr = String(num);
  const pos = randInt(0, numStr.length - 1); // index from left
  const digit = parseInt(numStr[pos]);
  const placeValueExp = numStr.length - 1 - pos;
  const correct = digit * Math.pow(10, placeValueExp);
  g6_pvState.answer = correct;

  // build highlighted display
  const display = numStr.split('').map((d, i) =>
    i === pos ? `<span style="color:#E11D48; text-decoration:underline;">${d}</span>` : d
  ).join('');

  const options = shuffle([
    correct,
    digit, // common error: value of digit ignoring place
    correct + Math.pow(10, placeValueExp), // off by one place step
    Math.max(1, correct - Math.pow(10, placeValueExp)),
  ].filter((v, i, arr) => arr.indexOf(v) === i).concat(correct)).filter((v,i,arr)=>arr.indexOf(v)===i);
  // ensure exactly 4 unique options including correct
  while (options.length < 4) options.push(correct + randInt(1,9));
  const finalOpts = shuffle(options.slice(0, 4).includes(correct) ? options.slice(0,4) : [correct, ...options.slice(0,3)]);

  document.getElementById('pv-question').innerHTML = `
    <div class="q-box">${tr(`In the number <strong>${display}</strong>, what is the value of the underlined digit?`, `In die getal <strong>${display}</strong>, wat is die waarde van die onderstreepte syfer?`)}</div>
    <div class="mcq-opts">
      ${finalOpts.map(o => `<div class="mcq-opt" onclick="g6_checkPV(this, ${o})">${o.toLocaleString('en-ZA').replace(/,/g,' ')}</div>`).join('')}
    </div>
    <button class="secondary small" onclick="g6_newPVQuestion()">${tr('Skip, new number', 'Slaan oor, nuwe getal')}</button>
  `;
  document.getElementById('pv-feedback').className = 'feedback';
}
function g6_checkPV(el, val) {
  g6_pvState.attempted++;
  const opts = document.querySelectorAll('#pv-question .mcq-opt');
  const fb = document.getElementById('pv-feedback');
  if (val === g6_pvState.answer) {
    g6_pvState.correct++;
    el.classList.add('correct');
    fb.className = 'feedback good';
    fb.textContent = tr('Yes, that is right! New question loading.', 'Ja, dit is reg! Nuwe vraag laai.');
    opts.forEach(o => o.onclick = null);
    setTimeout(g6_newPVQuestion, 1100);
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The correct value is ${g6_pvState.answer.toLocaleString('en-ZA').replace(/,/g,' ')}. Look at which column that digit sits in.`, `Nie heeltemal reg nie. Die korrekte waarde is ${g6_pvState.answer.toLocaleString('en-ZA').replace(/,/g,' ')}. Kyk in watter kolom daardie syfer sit.`);
    opts.forEach(o => o.onclick = null);
  }
  document.getElementById('pv-score').innerHTML = scoreHTML(g6_pvState);
}

function g6_normalizeFact(s) {
  return s.replace(/\s+/g, '').replace(/×/g, 'x').replace(/\*/g, 'x').replace(/÷/g, '/').toLowerCase();
}
function g6_checkFF() {

  const matched = entered.filter(e => e && correctSet.includes(e));
  const uniqueMatched = [...new Set(matched)];
  const fb = document.getElementById('ff-feedback');
  if (uniqueMatched.length === 4) {
    fb.className = 'feedback good';
    fb.textContent = tr('All 4 facts correct! Great work.', 'Al 4 feite reg! Uitstekende werk.');

  }
}

function g6_newFOQuestion() {
  const den = pick([4,5,6,8,10,12]);

  let n1 = randInt(1, den - 1), n2 = randInt(1, den - 1);
  let num;
  if (isAdd) { num = n1 + n2; }
  else { if (n2 > n1) [n1, n2] = [n2, n1]; num = n1 - n2; }
  g6_foState.num = num; g6_foState.den = den;
  document.getElementById('fo-question').innerHTML = `
    <div class="q-box">${n1}/${den} ${isAdd ? '+' : '-'} ${n2}/${den} = <input type="text" id="fo-in" placeholder="${tr(`for example 5/${den}`, `byvoorbeeld 5/${den}`)}" style="width:90px;" /></div>

  let ok = false;
  if (parts.length === 2) {
    const un = parseInt(parts[0]), ud = parseInt(parts[1]);
    if (!isNaN(un) && !isNaN(ud) && ud !== 0) {
      ok = un * g6_foState.den === g6_foState.num * ud; // cross multiply equivalence
    }
  } else if (parts.length === 1 && parseInt(parts[0]) === 0 && g6_foState.num === 0) {
    ok = true;
  }
  if (ok) {
    g6_foState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr(`Correct! (${g6_foState.num}/${g6_foState.den}). Next one.`, `Reg! (${g6_foState.num}/${g6_foState.den}). Volgende een.`);

}

function g6_buildMirrorGrid() {
  const grid = document.getElementById('mm-grid');
  grid.innerHTML = '';
  const rows = 5, cols = 12;
  const givenSet = new Set(g6_mmState.shape.map(([r,c]) => `${r},${c}`));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (c === 5) cell.classList.add('mirrorline');
      const key = `${r},${c}`;
      if (givenSet.has(key)) {
        cell.classList.add('given');
      } else if (c >= 6) {
        cell.classList.add('clickable');
        cell.onclick = () => {
          if (g6_mmState.userCells.has(key)) { g6_mmState.userCells.delete(key); cell.classList.remove('userfill'); }
          else { g6_mmState.userCells.add(key); cell.classList.add('userfill'); }
        };
      }
      grid.appendChild(cell);
    }
  }
}
function g6_clearMirror() {
  g6_mmState.userCells.clear();
  document.querySelectorAll('#mm-grid .cell.userfill').forEach(c => c.classList.remove('userfill'));
}
function g6_checkMirror() {
  const expected = new Set(g6_mmState.shape.map(([r,c]) => `${r},${11-c}`));
  const fb = document.getElementById('mm-feedback');
  const missing = [...expected].filter(k => !g6_mmState.userCells.has(k)).length;
  const extra = [...g6_mmState.userCells].filter(k => !expected.has(k)).length;
  if (missing === 0 && extra === 0) {
    fb.className = 'feedback good';
    fb.textContent = tr('Perfect reflection!', 'Perfekte spieëlbeeld!');
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite yet: ${missing} square(s) missing, ${extra} extra square(s). Remember, same row, mirrored column.`, `Nog nie heeltemal reg nie: ${missing} blokkie(s) kortkom, ${extra} ekstra blokkie(s). Onthou, dieselfde ry, gespieëlde kolom.`);
  }
}

    `;
  } else {
    const askMedian = Math.random() < 0.5;
    const scenarios = [
      { label: 'ages of children on a soccer team', labelAf: 'ouderdomme van kinders in \'n sokkerspan', pool: [9, 10, 11, 12, 13] },
      { label: 'temperatures (°C) recorded at noon this week', labelAf: 'temperature (°C) wat hierdie week die middag aangeteken is', pool: [18, 20, 21, 22, 24, 25, 26] },
      { label: 'scores out of 20 in a spelling test', labelAf: 'tellings uit 20 in \'n speltoets', pool: [12, 14, 15, 16, 17, 18, 19, 20] },
    ];
    const sc = pick(scenarios);
    let data, answer, text, hint, hintText;
    if (askMedian) {
      const n = pick([5, 7]);
      data = Array.from({ length: n }, () => pick(sc.pool));
      const sorted = [...data].sort((a, b) => a - b);
      answer = sorted[Math.floor(n / 2)];
      text = tr(`Here are the ${sc.label}: ${data.join(', ')}. What is the median?`, `Hier is die ${sc.labelAf}: ${data.join(', ')}. Wat is die mediaan?`);
      hintText = tr(`Order the data from smallest to largest first, then find the middle value. Ordered: ${sorted.join(', ')}.`, `Rangskik die data eers van kleinste na grootste, en vind dan die middelste waarde. Gerangskik: ${sorted.join(', ')}.`);
    } else {
      const pool = shuffle(sc.pool).slice(0, 4);
      const modeVal = pick(pool);
      const modeCount = randInt(3, 4);
      data = [];
      pool.forEach(v => {
        const count = v === modeVal ? modeCount : randInt(1, modeCount - 1);
        for (let i = 0; i < count; i++) data.push(v);
      });
      data = shuffle(data);
      answer = modeVal;
      text = tr(`Here are the ${sc.label}: ${data.join(', ')}. What is the mode?`, `Hier is die ${sc.labelAf}: ${data.join(', ')}. Wat is die modus?`);
      hintText = tr('The mode is the value that appears most often in the list.', 'Die modus is die waarde wat die meeste in die lys voorkom.');
    }
    g6_stState.answer = String(answer);
    g6_stState.hint = hintText;
    g6_stState.qType = askMedian ? 'median' : 'mode';
    document.getElementById('g6st-question').innerHTML = `
      <div class="q-box">${text}</div>
      <input type="number" id="g6st-in" style="width:110px;" autofocus />
      <button class="action" onclick="g6_checkSTInput()">${tr('Check', 'Gaan na')}</button>

      <div class="hint-text" id="g6st-hint">${g6_stState.hint}</div>
    `;
    const inputEl = document.getElementById('g6st-in');
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g6_checkSTInput(); });
  }

function g6_rectSVG(l, w, unit) {
  const maxDim = Math.max(l, w);
  const scale = 150 / maxDim;
  const pxL = Math.round(Math.max(60, l * scale));
  const pxW = Math.round(Math.max(60, w * scale));
  const ox = 46, oy = 26;
  return `<svg width="${pxL + ox + 20}" height="${pxW + oy + 20}" viewBox="0 0 ${pxL + ox + 20} ${pxW + oy + 20}" style="max-width:100%;">
    <rect x="${ox}" y="${oy}" width="${pxL}" height="${pxW}" fill="var(--sand-light)" stroke="#075985" stroke-width="3"/>
    <text x="${ox + pxL / 2}" y="${oy - 8}" text-anchor="middle" font-size="15" font-weight="800" fill="#075985">${l} ${unit}</text>
    <text x="${ox - 8}" y="${oy + pxW / 2}" text-anchor="end" dominant-baseline="middle" font-size="15" font-weight="800" fill="#075985">${w} ${unit}</text>
  </svg>`;
}

let manipPV = { number: 247, expanded: false, mode: 'explore', target: null };
const MANIP_PV_DEFS = [
  { place: 100, label: 'Hundreds', labelAf: 'Honderde', color: 'var(--ocean)', slots: 3 },
  { place: 10, label: 'Tens', labelAf: 'Tiene', color: 'var(--aqua)', slots: 2 },
  { place: 1, label: 'Units', labelAf: 'Eenhede', color: 'var(--coral)', slots: 1 },
];
const MANIP_PV_BASE_SLOT = 78, MANIP_PV_BASE_GAP = 22;
let MANIP_PV_SLOT = 78, MANIP_PV_GAP = 22;
let manipPVCardEls = [], manipPVExpandedLefts = [], manipPVExpandedWidths = [];
let manipPVResizeHandler = null;
// Recomputes MANIP_PV_SLOT/GAP (and a matching font scale) so the fully expanded
// row of cards always fits the space actually available, instead of always
// using the same fixed pixel sizes and overflowing on a narrower screen.
function manipPVComputeScale(stage) {
  const prevWidth = stage.style.width;
  stage.style.width = ''; // let it size naturally so clientWidth reflects the real available space
  const available = stage.clientWidth || 512;
  stage.style.width = prevWidth;
  const totalSlots = MANIP_PV_DEFS.reduce((s, d) => s + d.slots, 0);
  const naturalWidth = totalSlots * MANIP_PV_BASE_SLOT + (MANIP_PV_DEFS.length - 1) * MANIP_PV_BASE_GAP;
  const scale = Math.max(0.42, Math.min(1, (available - 4) / naturalWidth));
  MANIP_PV_SLOT = MANIP_PV_BASE_SLOT * scale;
  MANIP_PV_GAP = MANIP_PV_BASE_GAP * scale;
  return scale;
}

function manipPVBuildCards() {
  const stage = document.getElementById('mpv-stage');
  const scale = manipPVComputeScale(stage);
  const fontRem = Math.max(1.15, 2.6 * scale);
  const labelRem = Math.max(0.68, 0.85 * scale);
  const padRight = Math.max(6, 18 * scale);
  stage.innerHTML = '';
  manipPVCardEls = MANIP_PV_DEFS.map(p => {
    const card = document.createElement('div');
    card.className = 'pv-card';
    card.style.background = p.color;
    card.style.top = '0px';
    card.style.fontSize = fontRem + 'rem';
    card.style.paddingRight = padRight + 'px';
    const numSpan = document.createElement('span');
    card.appendChild(numSpan);
    const lbl = document.createElement('div');
    lbl.className = 'pv-label';
    lbl.style.fontSize = labelRem + 'rem';
    card.appendChild(lbl);
    card.addEventListener('click', () => { manipPV.expanded = !manipPV.expanded; manipRenderPV(); });
    stage.appendChild(card);
    return { card, numSpan, lbl };
  });
  const widths = MANIP_PV_DEFS.map(d => d.slots * MANIP_PV_SLOT);
  let running = 0;
  manipPVExpandedLefts = widths.map(w => { const left = running; running += w + MANIP_PV_GAP; return left; });
  manipPVExpandedWidths = widths;
  stage.style.width = (running - MANIP_PV_GAP) + 'px';
  if (manipPVResizeHandler) window.removeEventListener('resize', manipPVResizeHandler);
  manipPVResizeHandler = () => {
    if (!document.getElementById('mpv-stage')) { window.removeEventListener('resize', manipPVResizeHandler); return; }
    manipPVBuildCards();
    manipRenderPV();
  };
  window.addEventListener('resize', manipPVResizeHandler);
}
function manipRenderPV() {
  const n = Math.max(0, Math.min(999, manipPV.number));
  const digits = [Math.floor(n / 100), Math.floor((n % 100) / 10), n % 10];
  const slots = MANIP_PV_DEFS.map(d => d.slots);
  if (manipPV.expanded) {
    manipPVCardEls.forEach((els, i) => {
      const p = MANIP_PV_DEFS[i];
      const digit = digits[i];
      const value = digit * p.place;
      const width = manipPVExpandedWidths[i];
      els.card.style.width = width + 'px';
      els.card.style.left = manipPVExpandedLefts[i] + 'px';
      els.card.style.zIndex = i + 1;
      els.card.style.opacity = '1';
      els.card.style.pointerEvents = 'auto';
      els.numSpan.style.position = 'static';
      els.numSpan.style.width = 'auto';
      els.numSpan.textContent = value;
      els.lbl.textContent = `${tr(p.label, p.labelAf)} (${digit})`;
      els.lbl.style.opacity = '1';
      els.lbl.style.width = width + 'px';
      els.lbl.style.left = '0px';
    });
    document.getElementById('mpv-toggle-btn').textContent = tr('Build It', 'Bou Dit');
    return;
  }
  const sigDigits = n === 0 ? 1 : String(n).length;
  const startIdx = 3 - sigDigits;
  const sharedRight = slots[startIdx] * MANIP_PV_SLOT;
  manipPVCardEls.forEach((els, i) => {
    if (i < startIdx) {
      els.card.style.opacity = '0';
      els.card.style.pointerEvents = 'none';
      els.lbl.style.opacity = '0';
      return;
    }
    const p = MANIP_PV_DEFS[i];
    const digit = digits[i];
    const width = slots[i] * MANIP_PV_SLOT;
    const left = sharedRight - width;
    const posInStack = i - startIdx;
    els.card.style.width = width + 'px';
    els.card.style.left = left + 'px';
    els.card.style.zIndex = posInStack + 1;
    els.card.style.opacity = '1';
    els.card.style.pointerEvents = 'auto';
    els.numSpan.style.position = 'absolute';
    els.numSpan.style.left = '0px';
    els.numSpan.style.top = '0px';
    els.numSpan.style.bottom = '0px';
    els.numSpan.style.width = MANIP_PV_SLOT + 'px';
    els.numSpan.style.display = 'flex';
    els.numSpan.style.alignItems = 'center';
    els.numSpan.style.justifyContent = 'center';
    els.numSpan.textContent = digit;
    els.lbl.textContent = `${tr(p.label, p.labelAf)} (${digit})`;
    els.lbl.style.opacity = '0';
  });
  document.getElementById('mpv-toggle-btn').textContent = tr('Pull Apart', 'Trek Uitmekaar');
}

      document.getElementById('mfrac-circle-summary').innerHTML = `<span style="color:#B42318;">${tr('That piece is too big to fit, the circle is already full, try a smaller piece.', 'Daardie stuk is te groot om te pas, die sirkel is reeds vol, probeer \'n kleiner stuk.')}</span>`;
      manipCircleRenderMat();
      return;
    }
    manipWheelOrder.push(p.id);
  }
  manipLayoutWheel(); manipCircleRenderMat(); manipCircleUpdateSummary();
}
function manipCircleAddPiece(n) {
  const id = ++manipPieceCounter;
  const x = 30 + Math.random() * 300, y = 30 + Math.random() * 260;
  manipMatPieces.push({ id, n, x, y, rot: 0 });
  manipSelectedPieceId = id;
  manipCircleRenderMat();
}
function manipCircleRenderMat() {
  const mat = document.getElementById('mfrac-circle-mat');
  mat.innerHTML = '';

    const guide = document.createElement('div'); guide.className = 'm-guide-circle'; mat.appendChild(guide);
  }
  manipMatPieces.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'm-frac-piece' + (p.id === manipSelectedPieceId ? ' selected' : '');
    wrap.style.left = p.x + 'px'; wrap.style.top = p.y + 'px';
    wrap.style.zIndex = p.id === manipSelectedPieceId ? 100 : p.id;
    const svgEl = manipMakePieceSVG(p.n);
    svgEl.style.transform = 'rotate(' + p.rot + 'deg)';
    wrap.appendChild(svgEl);
    wrap.addEventListener('pointerdown', (evt) => {
      evt.preventDefault();
      manipSelectedPieceId = p.id;
      manipCircleRenderMat();
      const startX = evt.clientX, startY = evt.clientY, origX = p.x, origY = p.y;
      const liveWrap = mat.querySelector('.m-frac-piece.selected');
      function onMove(mv) {
        p.x = origX + (mv.clientX - startX); p.y = origY + (mv.clientY - startY);
        if (liveWrap) { liveWrap.style.left = p.x + 'px'; liveWrap.style.top = p.y + 'px'; }
      }
      function onUp() { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); manipTryWheelSnap(p); }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
    mat.appendChild(wrap);
  });
}
function manipCircleRotate(delta) {
  const p = manipMatPieces.find(pc => pc.id === manipSelectedPieceId);
  if (p && !manipWheelOrder.includes(p.id)) { p.rot += delta; manipCircleRenderMat(); }
}

}

    const letter = pick(G7_NOTATION_LETTERS);
    const num = randInt(2, 9);
    const kind = pick(['times', 'divide', 'plus', 'minus']);
    if (kind === 'times') { text = `${letter} multiplied by ${num}`; answer = `${num}${letter}`; options = shuffle([answer, `${letter}${num}`, `${letter}+${num}`, `${letter}-${num}`]); }
    else if (kind === 'divide') { text = `${letter} divided by ${num}`; answer = `${letter}/${num}`; options = shuffle([answer, `${num}/${letter}`, `${num}${letter}`, `${letter}-${num}`]); }
    else if (kind === 'plus') { text = `${num} more than ${letter}`; answer = `${letter}+${num}`; options = shuffle([answer, `${num}${letter}`, `${letter}-${num}`, `${letter}/${num}`]); }
    else { text = `${num} less than ${letter}`; answer = `${letter}-${num}`; options = shuffle([answer, `${num}-${letter}`, `${letter}+${num}`, `${num}${letter}`]); }
  } else {
    const letter = pick(G7_NOTATION_LETTERS);
    const a = randInt(2, 9), b = randInt(1, 8);
    const op = Math.random() < 0.5 ? '+' : '-';
    const useThird = Math.random() < 0.5;
    let exprText, total;
    if (useThird) {
      const c = randInt(1, 6);
      const op2 = Math.random() < 0.5 ? '+' : '-';
      exprText = `${a}${letter} ${op} ${b}${letter} ${op2} ${c}${letter}`;
      total = op === '+' ? a + b : a - b;
      total = op2 === '+' ? total + c : total - c;
    } else {
      exprText = `${a}${letter} ${op} ${b}${letter}`;
      total = op === '+' ? a + b : a - b;
    }
    if (total === 0) { total = a + b; exprText = `${a}${letter} + ${b}${letter}`; }
    text = `Simplify: ${exprText}`;
    answer = `${total}${letter}`;
    const distractors = new Set([answer, `${total+1}${letter}`, `${Math.max(1,total-1)}${letter}`]);
    let extra = total + 2;
    while (distractors.size < 4) { distractors.add(`${extra}${letter}`); extra++; }
    options = shuffle(Array.from(distractors)).slice(0, 4);
  }
  g7_noState.answer = answer;
  document.getElementById('g7no-question').innerHTML = `

}

// ---- g7_sequences ----
function g7_ntFormula(d, b) {
  if (b === 0) return `${d}n`;
  return `${d}n ${b > 0 ? '+' : '-'} ${Math.abs(b)}`;
}
function g7_seqDistractors(answer, d, b) {
  const candidates = new Set([answer]);
  let i = 1;
  while (candidates.size < 4 && i < 10) {
    candidates.add(g7_ntFormula(d + (i % 2 === 0 ? i : 0), b + (i % 2 === 1 ? i : 0)));
    i++;
  }
  return shuffle(Array.from(candidates)).slice(0, 4);
}
function g7_ordinalSuffix(n) {
  const j = n % 10, k = n % 100;
  if (j === 1 && k !== 11) return 'st';
  if (j === 2 && k !== 12) return 'nd';
  if (j === 3 && k !== 13) return 'rd';
  return 'th';
}

    html = `

function g7_coQuadrantOf(x, y) {

function g7_coGridSVG(px, py, showDot) {
  const scale = 22, cx = 150, cy = 150;

    lines += `<line x1="${cx + i*scale}" y1="10" x2="${cx + i*scale}" y2="290" stroke="#D9EEF3" stroke-width="1"/>`;
    lines += `<line x1="10" y1="${cy - i*scale}" x2="290" y2="${cy - i*scale}" stroke="#D9EEF3" stroke-width="1"/>`;
  }
  let dot = '';
  if (showDot) dot = `<circle cx="${cx + px*scale}" cy="${cy - py*scale}" r="7" fill="var(--coral)"/>`;
  return `<svg width="300" height="300" viewBox="0 0 300 300">
    ${lines}
    <line x1="10" y1="${cy}" x2="290" y2="${cy}" stroke="#075985" stroke-width="2"/>

function g7_gcdSimple(a,b){ return b===0?a:g7_gcdSimple(b,a%b); }

function g7_newPRQuestion() {

  if (qtype === 'fraction') {
    const colours = shuffle(['red', 'blue', 'green', 'yellow']).slice(0, 3);
    const counts = colours.map(() => randInt(1, 8));
    const total = counts.reduce((s,c) => s+c, 0);
    const askIdx = randInt(0, colours.length - 1);
    const g = g7_gcdSimple(counts[askIdx], total);
    const answer = `${counts[askIdx]/g}/${total/g}`;
    g7_prState.answer = answer;
    const distractors = new Set([answer]);

      <div class="q-box">A bag contains ${colours.map((c,i) => `${counts[i]} ${c}`).join(', ')} counters. One is picked at random. What is the probability, as a fraction in its simplest form, that it is ${colours[askIdx]}?</div>

  if (findWhat === 'distance') {
    text = `A car travels at ${speed} km/h for ${time} hours. How far does it travel, in km?`;
    answer = distance; unit = 'km';
    hint = 'Distance = Speed × Time.';
  } else if (findWhat === 'speed') {
    text = `A car travels ${distance} km in ${time} hours. What is its average speed, in km/h?`;
    answer = speed; unit = 'km/h';
    hint = 'Speed = Distance ÷ Time.';
  } else {
    text = `A car travels ${distance} km at a speed of ${speed} km/h. How long does the journey take, in hours?`;
    answer = time; unit = 'hours';
    hint = 'Time = Distance ÷ Speed.';
  }
  g8_spState.answer = answer;
  g8_spState.hint = hint;
  document.getElementById('g8sp-question').innerHTML = `
    <div class="q-box">${text}</div>
    <input type="number" id="g8sp-in" style="width:100px;" autofocus /> <span style="font-weight:700;">${unit}</span>
    <button class="action" onclick="g8_checkSP()">Check</button>
    <button class="secondary" onclick="g8_newSPQuestion()">New question</button>
    <div><button class="hint-toggle" onclick="document.getElementById('g8sp-hint').style.display='block'">Show hint</button></div>
    <div class="hint-text" id="g8sp-hint">${hint}</div>
  `;
  document.getElementById('g8sp-feedback').className = 'feedback';
  const inputEl = document.getElementById('g8sp-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g8_checkSP(); });
}
function g8_checkSP() {
  const v = parseFloat(document.getElementById('g8sp-in').value);
  g8_spState.attempted++;
  const fb = document.getElementById('g8sp-feedback');
  if (v === g8_spState.answer) {
    g8_spState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';

    fb.textContent = `Not quite. The answer was ${g8_spState.answer}. ${g8_spState.hint}`;
  }

}

// ---- g8_powers ----
let g8_poState = { correct: 0, attempted: 0, answer: null };
function g8_renderPowers() {
  g8_poState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔺 Powers, Roots and Standard Form</h2>
      <p class="subtext">National Curriculum for England, Key Stage 3, Year 8.</p>
      ${tutorHTML('g8_powers')}
      <div id="g8po-score">${scoreHTML(g8_poState)}</div>
      <div id="g8po-question"></div>
      <div id="g8po-feedback" class="feedback"></div>
    </div>
  `;
  g8_newPOQuestion();
}
function g8_newPOQuestion() {
  const qtype = pick(['square', 'cube', 'sqrt', 'standardform']);
  const fb = document.getElementById('g8po-feedback'); fb.className='feedback'; fb.textContent='';
  if (qtype === 'square') {
    const n = randInt(2, 15);
    g8_poState.answer = n * n;
    document.getElementById('g8po-question').innerHTML = `
      <div class="q-box">${n}² = ?</div>
      <input type="number" id="g8po-in" style="width:90px;" autofocus />
      <button class="action" onclick="g8_checkPONum()">Check</button>
      <button class="secondary" onclick="g8_newPOQuestion()">New question</button>
    `;
  } else if (qtype === 'cube') {
    const n = randInt(2, 6);
    g8_poState.answer = n * n * n;
    document.getElementById('g8po-question').innerHTML = `
      <div class="q-box">${n}³ = ?</div>
      <input type="number" id="g8po-in" style="width:90px;" autofocus />
      <button class="action" onclick="g8_checkPONum()">Check</button>
      <button class="secondary" onclick="g8_newPOQuestion()">New question</button>
    `;
  } else if (qtype === 'sqrt') {
    const n = randInt(2, 15);
    g8_poState.answer = n;
    document.getElementById('g8po-question').innerHTML = `
      <div class="q-box"><span style="font-family: Arial, Helvetica, sans-serif;">√</span>${n * n} = ?</div>
      <input type="number" id="g8po-in" style="width:90px;" autofocus />
      <button class="action" onclick="g8_checkPONum()">Check</button>
      <button class="secondary" onclick="g8_newPOQuestion()">New question</button>
    `;
  } else {
    const digit = randInt(1, 9);
    const decDigits = [randInt(0,9), randInt(0,9)];
    const power = randInt(2, 6);
    const mantissa = `${digit}.${decDigits.join('')}`;
    const ordinary = parseFloat(mantissa) * Math.pow(10, power);
    const answer = `${mantissa} × 10^${power}`;
    g8_poState.answer = answer;
    const options = shuffle([
      answer,
      `${mantissa} × 10^${power + 1}`,
      `${mantissa} × 10^${power - 1}`,
      `${digit}${decDigits.join('')} × 10^${power}`,
    ]);
    document.getElementById('g8po-question').innerHTML = `
      <div class="q-box">Write ${Math.round(ordinary * 1000) / 1000} in standard form.</div>
      <div class="mcq-opts">${options.map(o => `<div class="mcq-opt" onclick="g8_checkPOMCQ(this, '${o}')">${o}</div>`).join('')}</div>
      <button class="secondary small" onclick="g8_newPOQuestion()">New question</button>
    `;
  }
  const inputEl = document.getElementById('g8po-in');
  if (inputEl) inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g8_checkPONum(); });
}
function g8_checkPONum() {
  const v = parseFloat(document.getElementById('g8po-in').value);
  g8_poState.attempted++;
  const fb = document.getElementById('g8po-feedback');
  if (v === g8_poState.answer) {
    g8_poState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(g8_newPOQuestion, 900);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The answer was ${g8_poState.answer}.`;
  }
  document.getElementById('g8po-score').innerHTML = scoreHTML(g8_poState);
}
function g8_checkPOMCQ(el, val) {
  g8_poState.attempted++;
  const opts = document.querySelectorAll('#g8po-question .mcq-opt');
  const fb = document.getElementById('g8po-feedback');
  if (val === g8_poState.answer) {
    g8_poState.correct++;
    el.classList.add('correct');
    fb.className = 'feedback good';
    fb.textContent = 'Correct! New question loading.';
    opts.forEach(o => o.onclick = null);
    setTimeout(g8_newPOQuestion, 1100);
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The answer was ${g8_poState.answer}.`;
    opts.forEach(o => o.onclick = null);
  }
  document.getElementById('g8po-score').innerHTML = scoreHTML(g8_poState);
}

// ---- g8_circles ----
// The embedded handwriting font has a blank glyph for 'π' and '√', so those characters
// are wrapped in a plain sans-serif span wherever they appear, to keep them visible.
const G8_PI = '<span style="font-family: Arial, Helvetica, sans-serif;">π</span>';
let g8_ciState = { correct: 0, attempted: 0, answer: null, hint: '' };
function g8_renderCircles() {
  g8_ciState = { correct: 0, attempted: 0, answer: null, hint: '' };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">⭕ Circumference and Area of a Circle</h2>
      <p class="subtext">National Curriculum for England, Key Stage 3, Year 8. Use ${G8_PI} ≈ 3.14. Round your answer to 1 decimal place.</p>
      ${tutorHTML('g8_circles')}
      <div id="g8ci-score">${scoreHTML(g8_ciState)}</div>
      <div id="g8ci-question"></div>
      <div id="g8ci-feedback" class="feedback"></div>
    </div>
  `;
  g8_newCIQuestion();
}
function g8_newCIQuestion() {
  const qtype = pick(['circumference', 'area']);
  const radius = randInt(2, 15);
  let text, answer, hint;
  if (qtype === 'circumference') {
    answer = Math.round(2 * 3.14 * radius * 10) / 10;
    text = `A circle has a radius of ${radius} cm. What is its circumference, in cm? (Use ${G8_PI} ≈ 3.14, round to 1 decimal place.)`;
    hint = `Circumference = 2 × ${G8_PI} × radius.`;
  } else {
    answer = Math.round(3.14 * radius * radius * 10) / 10;
    text = `A circle has a radius of ${radius} cm. What is its area, in cm²? (Use ${G8_PI} ≈ 3.14, round to 1 decimal place.)`;
    hint = `Area = ${G8_PI} × radius².`;
  }
  g8_ciState.answer = answer;
  g8_ciState.hint = hint;
  document.getElementById('g8ci-question').innerHTML = `
    <div class="q-box">${text}</div>
    <input type="number" step="0.1" id="g8ci-in" style="width:100px;" autofocus />
    <button class="action" onclick="g8_checkCI()">Check</button>
    <button class="secondary" onclick="g8_newCIQuestion()">New question</button>
    <div><button class="hint-toggle" onclick="document.getElementById('g8ci-hint').style.display='block'">Show hint</button></div>
    <div class="hint-text" id="g8ci-hint">${hint}</div>
  `;
  document.getElementById('g8ci-feedback').className = 'feedback';
  const inputEl = document.getElementById('g8ci-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g8_checkCI(); });
}
function g8_checkCI() {
  const v = parseFloat(document.getElementById('g8ci-in').value);
  g8_ciState.attempted++;
  const fb = document.getElementById('g8ci-feedback');
  if (Math.abs(v - g8_ciState.answer) < 0.15) {
    g8_ciState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(g8_newCIQuestion, 1000);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The answer was ${g8_ciState.answer}. ${g8_ciState.hint}`;
  }
  document.getElementById('g8ci-score').innerHTML = scoreHTML(g8_ciState);
}

// ---- g8_pythagoras ----
const G8_PYTHAG_TRIPLES = [[3,4,5],[5,12,13],[8,15,17],[7,24,25],[9,12,15],[6,8,10],[20,21,29]];
let g8_pyState = { correct: 0, attempted: 0, answer: null };
function g8_pySVG(a, b, missingSide) {
  const scale = Math.min(140 / Math.max(a,4), 100 / Math.max(b,4));
  const w = Math.max(30, a * scale), h = Math.max(30, b * scale);
  const ox = 30, oy = 130;
  return `<svg width="220" height="160" viewBox="0 0 220 160">
    <polygon points="${ox},${oy} ${ox+w},${oy} ${ox},${oy-h}" fill="var(--sand-light)" stroke="#075985" stroke-width="2.5"/>
    <rect x="${ox}" y="${oy-14}" width="14" height="14" fill="none" stroke="#075985" stroke-width="1.5"/>
    <text x="${ox+w/2}" y="${oy+18}" text-anchor="middle" font-size="14" font-weight="800" fill="#075985">${missingSide === 'a' ? '?' : a}</text>
    <text x="${ox-16}" y="${oy-h/2}" text-anchor="middle" font-size="14" font-weight="800" fill="#075985">${missingSide === 'b' ? '?' : b}</text>
    <text x="${ox+w/2+10}" y="${oy-h/2-6}" text-anchor="middle" font-size="14" font-weight="800" fill="#B45309">${missingSide === 'c' ? '?' : ''}</text>
    <line x1="${ox+w}" y1="${oy}" x2="${ox}" y2="${oy-h}" stroke="#B45309" stroke-width="2.5"/>
  </svg>`;
}
function g8_renderPythagoras() {
  g8_pyState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">📏 Pythagoras' Theorem</h2>
      <p class="subtext">National Curriculum for England, Key Stage 3, Year 8. a² + b² = c², where c is the hypotenuse.</p>
      ${tutorHTML('g8_pythagoras')}
      <div id="g8py-score">${scoreHTML(g8_pyState)}</div>
      <div id="g8py-question"></div>
      <div id="g8py-feedback" class="feedback"></div>
    </div>
  `;
  g8_newPYQuestion();
}
function g8_newPYQuestion() {
  const triple = pick(G8_PYTHAG_TRIPLES);
  const [a, b, c] = triple;
  const findHyp = Math.random() < 0.5;
  let text, answer, missingSide;
  if (findHyp) {
    answer = c; missingSide = 'c';
    text = `A right-angled triangle has two shorter sides of ${a} cm and ${b} cm. What is the length of the hypotenuse, in cm?`;
  } else {
    const pickA = Math.random() < 0.5;
    answer = pickA ? a : b;
    missingSide = pickA ? 'a' : 'b';
    const other = pickA ? b : a;
    text = `A right-angled triangle has a hypotenuse of ${c} cm and one shorter side of ${other} cm. What is the length of the other shorter side, in cm?`;
  }
  g8_pyState.answer = answer;
  document.getElementById('g8py-question').innerHTML = `
    <div style="text-align:center;">${g8_pySVG(a, b, missingSide)}</div>
    <div class="q-box">${text}</div>
    <input type="number" id="g8py-in" style="width:90px;" autofocus />
    <button class="action" onclick="g8_checkPY()">Check</button>
    <button class="secondary" onclick="g8_newPYQuestion()">New question</button>
  `;
  document.getElementById('g8py-feedback').className = 'feedback';
  const inputEl = document.getElementById('g8py-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g8_checkPY(); });
}
function g8_checkPY() {
  const v = parseFloat(document.getElementById('g8py-in').value);
  g8_pyState.attempted++;
  const fb = document.getElementById('g8py-feedback');
  if (v === g8_pyState.answer) {
    g8_pyState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(g8_newPYQuestion, 900);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The answer was ${g8_pyState.answer} cm.`;
  }
  document.getElementById('g8py-score').innerHTML = scoreHTML(g8_pyState);
}

let g8_enState = { correct: 0, attempted: 0, answer: null };
function g8_renderEnlarge() {
  g8_enState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔍 Enlargement and Scale Factor</h2>
      <p class="subtext">National Curriculum for England, Key Stage 3, Year 8. Every length is multiplied by the same scale factor.</p>

      <div id="g8en-score">${scoreHTML(g8_enState)}</div>
      <div id="g8en-question"></div>
      <div id="g8en-feedback" class="feedback"></div>
    </div>
  `;
  g8_newENQuestion();
}
function g8_newENQuestion() {
  const qtype = pick(['findimage', 'findscale', 'findoriginal']);
  const original = randInt(2, 12);
  const scale = pick([2, 3, 4, 0.5]);
  const image = original * scale;
  let text, answer;
  if (qtype === 'findimage') {
    text = `A shape has a side length of ${original} cm. It is enlarged by a scale factor of ${scale}. What is the length of that side in the enlarged shape, in cm?`;
    answer = image;
  } else if (qtype === 'findscale') {
    text = `A side of length ${original} cm is enlarged to ${image} cm. What is the scale factor?`;
    answer = scale;
  } else {
    text = `A shape is enlarged by a scale factor of ${scale}, and a side in the enlarged shape is ${image} cm. What was the length of that side in the original shape, in cm?`;
    answer = original;
  }
  g8_enState.answer = answer;
  document.getElementById('g8en-question').innerHTML = `
    <div class="q-box">${text}</div>
    <input type="number" step="0.1" id="g8en-in" style="width:90px;" autofocus />
    <button class="action" onclick="g8_checkEN()">Check</button>
    <button class="secondary" onclick="g8_newENQuestion()">New question</button>
  `;

  const inputEl = document.getElementById('g8en-in');
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') g8_checkEN(); });
}
function g8_checkEN() {
  const v = parseFloat(document.getElementById('g8en-in').value);
  g8_enState.attempted++;
  const fb = document.getElementById('g8en-feedback');
  if (Math.abs(v - g8_enState.answer) < 0.01) {
    g8_enState.correct++;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! Next one.';
    setTimeout(g8_newENQuestion, 900);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite. The answer was ${g8_enState.answer}.`;
  }
  document.getElementById('g8en-score').innerHTML = scoreHTML(g8_enState);
}
