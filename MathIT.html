  :root {
    --ocean: #0284C7;
    --ocean-dark: #075985;
    --ocean-light: #E0F2FE;
    --aqua: #06B6D4;
    --aqua-dark: #0E7490;
    --aqua-light: #CFFAFE;
    --coral: #FB7185;
    --coral-dark: #E11D48;
    --coral-light: #FFE4E6;
    --sand: #D9A441;
    --sand-dark: #A8791F;
    --sand-light: #FBF0DA;
    --grey-bg: #F2FAFB;
    --card-bg: #FFFFFF;
    --border: #D9EEF3;
    --text: #12303B;
    --text-soft: #4F7480;
    --good: #157F3C;
    --good-bg: #E6F5EA;
    --bad: #C0392B;
    --bad-bg: #FBEAEA;
    --shade: var(--ocean);
    /* legacy aliases so ported activity CSS keeps working unchanged */
    --purple: var(--ocean); --purple-dark: var(--ocean-dark); --purple-light: var(--ocean-light);
    --blue: var(--aqua-dark); --blue-light: var(--aqua-light);
    --orange: var(--sand); --orange-light: var(--sand-light);
    --pink: var(--coral); --pink-light: var(--coral-light);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: relative;
    font-family: 'Teachers Pet', 'Patrick Hand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--grey-bg);
    color: var(--text);
  }
  body::before {
    content: '';
    position: fixed;

  h1, h2, h3, .tile h3, button { font-family: 'Teachers Pet', 'Patrick Hand', -apple-system, BlinkMacSystemFont, sans-serif; }
  header {
    position: relative;
    background: linear-gradient(120deg, var(--ocean-dark) 0%, var(--ocean) 50%, var(--aqua) 100%);
    color: #fff;
    padding: 26px 20px 40px;
    text-align: center;
    overflow: hidden;
  }
  header h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: 0.02em; }
  .header-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; position: relative; z-index: 1; }
  .header-title-row .mascot { width: 46px; height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  header p { margin: 0; color: #E3F7FB; font-size: 0.92rem; }
  header .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 30px; display: block; }
  #mathit-header-greeting { position: relative; z-index: 1; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .mathit-greet-name { font-weight: 800; color: #fff; font-size: 0.95rem; background: rgba(3,30,48,0.35); border-radius: 16px; padding: 5px 14px; }
  .mathit-streak-badge { font-weight: 800; color: #FFF7ED; font-size: 0.9rem; background: rgba(251, 146, 60, 0.35); border: 2px solid rgba(255,255,255,0.6); border-radius: 16px; padding: 4px 12px; }
  .mathit-switch-link { color: #E3F7FB; text-decoration: underline; font-size: 0.8rem; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .welcome-card { max-width: 480px; margin: 32px auto; text-align: center; }
  .welcome-profile-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .level-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 18px 0 0; position: relative; z-index: 1; }
  .level-tab {
    background: rgba(3,30,48,0.45); color: #fff; border: 2px solid rgba(255,255,255,0.8);
    border-radius: 20px; padding: 7px 16px; font-weight: 800; font-size: 0.9rem; cursor: pointer;
    font-family: 'Teachers Pet', 'Patrick Hand', sans-serif; letter-spacing: 0.01em;
  }
  .level-tab:hover { background: rgba(3,30,48,0.65); }
  .level-tab.active { background: #fff; color: var(--ocean-dark); border-color: #fff; font-weight: 800; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(2,132,199,0.07);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .section-heading {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; color: var(--ocean-dark);
    font-size: 1.1rem; margin: 24px 0 10px; padding-left: 2px;
  }
  .section-heading:first-child { margin-top: 4px; }
  .tile {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border-top: 4px solid var(--tile-color, var(--ocean));
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(2,132,199,0.16); }
  .tile .dot {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    background: var(--tile-bg, var(--ocean-light));
    color: var(--tile-color, var(--ocean));
  }
  .tile h3 { margin: 0 0 4px; font-size: 1.0rem; color: var(--ocean-dark); font-weight: 700; }
  .tile p { margin: 0; font-size: 0.82rem; color: var(--text-soft); }
  .tile .badge { display: inline-block; font-size: 0.68rem; font-weight: 700; color: var(--coral-dark); background: var(--coral-light); border-radius: 8px; padding: 2px 7px; margin-top: 6px; }
  .backbtn {
    background: none; border: none; color: var(--coral-dark); font-weight: 700;
    cursor: pointer; font-size: 0.92rem; padding: 4px 0; margin-bottom: 10px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .backbtn:hover { text-decoration: underline; }
  h2.activity-title { color: var(--ocean-dark); margin: 0 0 6px; font-size: 1.4rem; font-weight: 800; }
  .subtext { color: var(--text-soft); font-size: 0.92rem; margin: 0 0 14px; line-height: 1.4; }
  .levelnote { display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--coral-dark); background: var(--coral-light); border-radius: 8px; padding: 3px 9px; margin: 0 0 12px; }

  .tutor-box { margin-bottom: 16px; }
  button.tutor-toggle {
    background: var(--sand-light); color: #6B4E14; border: 1.5px dashed var(--sand);
    border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
  }
  button.tutor-toggle:hover { background: #F5E3BC; }
  .tutor-panel {
    display: none; margin-top: 10px; background: var(--sand-light); border-radius: 10px;
    padding: 12px 14px; font-size: 0.86rem; color: #5C4110; line-height: 1.5; border-left: 4px solid var(--sand);
  }

  button.action {
    background: linear-gradient(120deg, var(--coral), #FB8FA0); color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    margin-right: 8px; margin-top: 8px;
  }
  button.action:hover { filter: brightness(0.95); }
  button.secondary {
    background: #fff; color: var(--ocean-dark); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    margin-right: 8px; margin-top: 8px;
  }
  button.secondary:hover { border-color: var(--ocean); }
  button.small { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; }
  input[type=text], input[type=number] {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px;
    font-size: 1rem; width: 130px; margin-right: 8px;
  }
  input[type=text]:focus, input[type=number]:focus { outline: 2px solid var(--coral); border-color: var(--coral); }
  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-weight: 700;
    display: none; font-size: 0.95rem;
  }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .feedback.info { display: block; background: var(--aqua-light); color: var(--aqua-dark); font-weight: 600; }
  .scorepill {
    display: inline-block; background: var(--aqua-light); color: var(--aqua-dark);
    font-weight: 800; font-size: 0.85rem; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px;
  }
  .q-box {
    font-size: 1.15rem; font-weight: 700; color: var(--ocean-dark); margin: 14px 0;
    background: var(--ocean-light); border-radius: 12px; padding: 14px 16px;
  }
  .mcq-opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .mcq-opt {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 16px;
    cursor: pointer; font-weight: 700; color: var(--ocean-dark); background: #fff;
  }
  .mcq-opt:hover { border-color: var(--coral); }
  .mcq-opt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .mcq-opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .fracbar { display: flex; gap: 2px; margin: 6px 0; }
  .fracbar .seg { flex: 1; height: 34px; border: 1.5px solid var(--ocean-dark); background: #fff; }
  .fracbar .seg.filled { background: var(--coral); }
  .fracbar .seg:first-child { border-radius: 6px 0 0 6px; }
  .fracbar .seg:last-child { border-radius: 0 6px 6px 0; }
  .fraclabel { font-size: 0.85rem; color: var(--text-soft); margin-bottom: 2px; }
  .pattern-grid { display: grid; gap: 3px; margin: 8px 0; }
  .pattern-grid .blk { width: 22px; height: 22px; border-radius: 4px; background: var(--border); }
  .pattern-grid .blk.on { background: var(--coral); }
  .pattern-step { display: inline-block; text-align: center; margin: 0 16px 10px 0; vertical-align: top; }
  .pattern-step .count { font-weight: 800; color: var(--ocean-dark); margin-top: 4px; }
  .hint-toggle { color: var(--aqua-dark); background: none; border: none; cursor: pointer; font-size: 0.88rem; font-weight: 700; padding: 0; margin-top: 10px; }
  .hint-text { display: none; margin-top: 8px; font-size: 0.88rem; color: var(--text-soft); background: var(--aqua-light); padding: 10px 12px; border-radius: 10px; }
  .posgrid { display: inline-grid; gap: 2px; margin: 10px 0; }
  .posgrid .pcell { width: 42px; height: 42px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .posgrid .pcell.clickable { cursor: pointer; }
  .posgrid .pcell.clickable:hover { background: var(--ocean-light); }
  .posgrid .pcell.start { background: var(--sand-light); border-color: var(--sand); }
  .posgrid .pcell.picked { background: var(--coral-light); border-color: var(--coral); }
  .posgrid .pcell.headcell { background: var(--ocean-dark); color: #fff; font-weight: 700; font-size: 0.8rem; }

  /* ---- classes ported from the Grade 6 app (Level 6 activities), colors alias to the beach palette above ---- */
  .gridwrap { display: inline-block; }
  .hundred-grid { display: grid; grid-template-columns: repeat(10, 26px); gap: 2px; margin: 14px 0; }
  .hundred-grid .cell {
    width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; background: #fff;
  }
  .hundred-grid .cell.shaded { background: var(--shade); border-color: var(--ocean-dark); }
  .readout { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0; }
  .readout .box { background: var(--ocean-light); border-radius: 12px; padding: 10px 16px; text-align: center; min-width: 90px; }
  .readout .box .val { font-size: 1.25rem; font-weight: 800; color: var(--ocean-dark); }
  .readout .box .lbl { font-size: 0.75rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .mirror-grid { display: grid; grid-template-columns: repeat(12, 30px); gap: 2px; margin: 14px 0; width: max-content; }
  .mirror-grid .cell { width: 30px; height: 30px; border: 1px solid var(--border); background: #fff; }
  .mirror-grid .cell.given { background: var(--aqua-dark); border-color: var(--ocean-dark); }
  .mirror-grid .cell.clickable { cursor: pointer; }
  .mirror-grid .cell.userfill { background: var(--coral); border-color: var(--ocean-dark); }
  .mirror-grid .mirrorline { border-right: 3px solid var(--sand) !important; }

  /* ---- new Foundation Phase activities: number bonds, ten frames, renaming, hundred grid, time, pyramid ---- */
  .tenframe { display: grid; grid-template-columns: repeat(5, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; margin: 14px 0; }
  .tenframe .tf-cell { border: 2px solid var(--ocean-dark); border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  .tenframe .tf-cell.clickable { cursor: pointer; }
  .tenframe .tf-cell.clickable:hover { background: var(--ocean-light); }
  .tenframe .tf-cell.filled { background: var(--coral-light); border-color: var(--coral); }
  .numgrid { display: grid; grid-template-columns: repeat(10, 38px); gap: 3px; margin: 14px 0; }
  .numgrid .ncell { width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; color: var(--ocean-dark); }
  .numgrid .ncell.given { background: var(--sand-light); }
  .numgrid .ncell input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-size: 0.82rem; font-weight: 700; color: inherit; font-family: inherit; }
  .numgrid .ncell.right { background: var(--good-bg); }
  .numgrid .ncell.wrongcell { background: var(--bad-bg); }
  .pyramid { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0; }
  .pyramid-row { display: flex; gap: 10px; }
  .pbrick { width: 58px; height: 46px; border-radius: 10px; background: #fff; border: 2px solid var(--ocean-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15rem; color: var(--ocean-dark); }
  .pbrick.given { background: var(--sand-light); }
  .pbrick input { width: 44px; height: 34px; text-align: center; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 6px; background: var(--ocean-light); font-family: inherit; color: inherit; }
  .tally-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tally-row input[type=text] { width: 110px; }
  .tally-row .count { font-weight: 800; color: var(--ocean-dark); min-width: 24px; text-align: center; }
  .bar-chart { display: flex; align-items: flex-end; gap: 18px; height: 180px; margin: 18px 0 6px; border-bottom: 2px solid var(--border); padding: 0 6px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 60px; }
  .bar-col .num { font-weight: 800; color: var(--ocean-dark); font-size: 0.85rem; margin-bottom: 4px; }
  .bar-col .bar { width: 40px; border-radius: 8px 8px 0 0; transition: height 0.2s ease; }
  .bar-col .lbl { margin-top: 6px; font-size: 0.78rem; color: var(--text-soft); text-align: center; }

  footer { text-align: center; color: var(--text-soft); font-size: 0.8rem; padding: 20px; }

  /* ---- Manipulatives tab ---- */
  :root { --m-flat: var(--ocean); --m-rod: #3ba55d; --m-unit: var(--sand); --m-counter: var(--coral); }
  .manip-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .manip-nav .m-tab {
    background: rgba(3,30,48,0.08); color: var(--ocean-dark); border: 2px solid var(--border);
    border-radius: 20px; padding: 7px 14px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
    font-family: 'Teachers Pet', 'Patrick Hand', sans-serif;
  }
  .manip-nav .m-tab:hover { background: var(--ocean-light); }
  .manip-nav .m-tab.active { background: var(--ocean-dark); color: #fff; border-color: var(--ocean-dark); }
  .m-help { color: var(--text-soft); font-size: 0.88rem; margin-top: -6px; margin-bottom: 12px; }
  .m-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .m-total { font-size: 1.4rem; font-weight: 800; color: var(--ocean-dark); }

  .m-coin, .m-note {
    display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer;
    user-select: none; border: 2px solid rgba(0,0,0,0.15); transition: transform 0.1s; color: #3a2e0d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .m-coin:hover, .m-note:hover { transform: scale(1.06); }
  .m-coin { width: 60px; height: 60px; border-radius: 50%; }
  .m-note { width: 96px; height: 52px; border-radius: 8px; color: #fff; font-size: 0.9rem; }
  .m-tray { min-height: 110px; border: 2px dashed var(--border); border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; background: #fafcff; }
  .m-tray .m-coin, .m-tray .m-note { width: 46px; height: 46px; font-size: 0.78rem; }
  .m-tray .m-note { width: 76px; height: 42px; }

  .pv-stage { position: relative; height: 170px; margin: 20px 0 30px; overflow-x: auto; overflow-y: visible; }
  .pv-card {
    position: absolute; top: 0; height: 150px; border-radius: 14px; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 18px; font-size: 2.6rem; font-weight: 800; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: all 0.5s cubic-bezier(.3,1.4,.5,1); cursor: pointer;
  }
  .pv-label { position: absolute; bottom: -24px; font-size: 0.85rem; font-weight: 700; color: var(--text-soft); width: 100%; text-align: center; left: 0; }

  .b10-mat { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; min-height: 220px; border: 2px dashed var(--border); border-radius: 12px; padding: 14px; background: #fafcff; }
  .b10-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
  .b10-unit { width: 20px; height: 20px; background: var(--m-unit); border: 1px solid rgba(0,0,0,0.35); border-radius: 3px; cursor: pointer; }
  .b10-rod { width: 20px; height: 200px; background-color: var(--m-rod); border: 1px solid rgba(0,0,0,0.35); border-radius: 3px; cursor: pointer;
    background-image: linear-gradient(0deg, transparent 18px, rgba(0,0,0,0.28) 18px, rgba(0,0,0,0.28) 20px); background-size: 20px 20px; }
  .b10-flat { width: 200px; height: 200px; background-color: var(--m-flat); border: 1px solid rgba(0,0,0,0.35); border-radius: 3px; cursor: pointer;
    background-image: linear-gradient(0deg, transparent 18px, rgba(0,0,0,0.28) 18px, rgba(0,0,0,0.28) 20px), linear-gradient(90deg, transparent 18px, rgba(0,0,0,0.28) 18px, rgba(0,0,0,0.28) 20px);
    background-size: 20px 20px; }
  .m-palette-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .m-palette-item span { font-size: 0.8rem; font-weight: 700; color: var(--text-soft); }

  .m-clock-wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .m-digital { font-size: 2.1rem; font-weight: 800; color: var(--ocean-dark); }
  .m-words-time { font-size: 1.1rem; color: var(--text-soft); font-weight: 700; margin-top: 2px; min-height: 1.4em; }

  .m-frames-holder { display: flex; flex-wrap: wrap; gap: 20px; }
  .m-ten-frame { display: grid; grid-template-columns: repeat(5, 50px); grid-template-rows: repeat(2, 50px); gap: 4px; background: var(--ocean); padding: 6px; border-radius: 8px; }
  .m-tf-cell { background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .m-tf-counter { width: 34px; height: 34px; border-radius: 50%; background: var(--m-counter); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2); }

  .m-frac-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .m-frac-row .label { width: 56px; font-weight: 700; color: var(--text-soft); }
  .m-frac-bar { display: flex; flex: 1; height: 42px; border-radius: 8px; overflow: hidden; border: 2px solid var(--border); }
  .m-frac-seg { flex: 1; border-right: 2px solid var(--border); cursor: pointer; background: #fff; transition: 0.1s; }
  .m-frac-seg:last-child { border-right: none; }
  .m-frac-seg.shaded { background: var(--coral); }

  .m-circle-mat { position: relative; min-height: 400px; border: 2px dashed var(--border); border-radius: 12px; background: #fafcff; }
  .m-guide-circle { position: absolute; width: 220px; height: 220px; border: 3px dashed #a9b8cc; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .m-frac-piece { position: absolute; width: 90px; height: 90px; cursor: grab; touch-action: none; }
  .m-frac-piece.selected { box-shadow: 0 0 0 4px var(--ocean-dark), 0 4px 10px rgba(0,0,0,0.15); border-radius: 50%; }
  .m-frac-piece svg { width: 100%; height: 100%; transition: transform 0.1s; display: block; }

  .m-abacus { display: flex; flex-direction: column; gap: 9px; margin: 10px 0; }
  .m-rod-row { display: flex; align-items: center; gap: 10px; }
  .m-rod-label { width: 26px; font-weight: 700; text-align: center; color: var(--text-soft); font-size: 0.85rem; }
  .m-rod { position: relative; flex: none; height: 6px; background: var(--border); border-radius: 3px; display: flex; align-items: center; }
  .m-bead { width: 24px; height: 24px; border-radius: 50%; margin-right: 3px; cursor: pointer; flex: none; background: #dfe6ef; box-shadow: inset 0 -4px 5px rgba(0,0,0,0.15); transition: 0.15s; }
  .m-bead.groupB { background: #c9d3e2; }
  .m-bead.active { background: var(--coral); }
  .m-bead.active.groupB { background: var(--ocean); }
  .m-rod-value { width: 28px; font-weight: 800; color: var(--ocean-dark); text-align: center; }

  .m-dot-card { width: 240px; height: 240px; border: 3px solid var(--ocean); border-radius: 16px; background: #fff; display: grid; position: relative !important; margin: 10px 0; }
  .m-dot-card.dice { grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); padding: 14px; }
  .m-dot-card.frame { grid-template-columns: repeat(5,1fr); grid-template-rows: repeat(2,1fr); padding: 16px; gap: 6px; }
  .m-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--coral); justify-self: center; align-self: center; }
  .m-dot-card.scatter { display: block; }
  .m-dot-card.scatter .m-dot { position: absolute; }
  .m-cover { position: absolute; inset: 0; background: var(--ocean-dark); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; border-radius: 12px; cursor: pointer; text-align: center; padding: 10px; }

  .m-dice-tray { display: flex; gap: 20px; flex-wrap: wrap; }
  .m-die { width: 84px; height: 84px; background: #fff; border: 3px solid var(--ocean-dark); border-radius: 14px; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); padding: 10px; }
  .m-die .pip { width: 15px; height: 15px; border-radius: 50%; background: var(--ocean-dark); justify-self: center; align-self: center; }

  .m-plate { width: 106px; min-height: 106px; border: 3px dashed var(--ocean); border-radius: 50%; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px; padding: 10px; }
  .m-plate.leftover { border-color: var(--coral); }
  .m-counter-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--sand); }
  .m-plates-row { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; }
  .m-plate-wrap { text-align: center; }
  .m-plate-label { font-size: 0.75rem; color: var(--text-soft); margin-top: 4px; }

  .m-dh-dots { display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; margin-top: 10px; }
  .m-dh-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ocean); }
  .m-dh-split { display: flex; gap: 24px; margin-top: 14px; flex-wrap: wrap; }
  .m-dh-group { border: 2px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 220px; }
</style>
</head>

<script>

// ---------- Utilities ----------
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fracBar(numerator, denominator) {
  let segs = '';
  for (let i = 0; i < denominator; i++) segs += `<div class="seg ${i < numerator ? 'filled' : ''}"></div>`;
  return `<div class="fracbar">${segs}</div>`;
}

const app = document.getElementById('app');
const BEACH = ['ocean', 'aqua', 'coral', 'sand'];
let currentLevel = '4';
let currentActivityKey = 'home';

// ---------- Language ----------
// currentLang is per student profile (English by default). Levels 7 and 8 are
// UK curriculum content and stay English-only regardless of this setting;
// everything from Foundation Phase through Level 6, plus the Manipulatives
// tab, is fully bilingual. tr(en, af) is the one helper used everywhere a
// piece of text needs an Afrikaans version: call it inline with the English
// string first and the Afrikaans string second. (Named "tr", not "t" -- this
// codebase already uses a plain "t" as a local variable name in many places,
// e.g. for "time"/"target"/"tab", so a global t() would get shadowed there.)
let currentLang = 'en';
function tr(en, af) { return currentLang === 'af' ? af : en; }
function mathitSetLang(lang) {
  currentLang = lang === 'af' ? 'af' : 'en';
  const profile = mathitGetActiveProfile();
  if (profile) {
    profile.language = currentLang;
    const profiles = mathitLoadProfiles();
    const idx = profiles.findIndex(p => p.name === profile.name);
    if (idx !== -1) { profiles[idx] = profile; mathitSaveProfiles(profiles); }
  }
  mathitRenderHeaderGreeting();
  if (currentLevel === 'manipulatives') { renderManipulatives(); }
  else { goTo(currentActivityKey); }
}

// ---------- Tutor explanations ----------
const TUTOR_NOTES = {
  g4_placevalue: "Grade 4 numbers go up to 9999, so this checks the same skill as bundling on a place value chart, just one column further than Grade 3. If she cannot do this confidently for 3 digit numbers yet, it is worth stepping back before pushing into thousands.",
  g4_compare: "Comparing starts from the leftmost digit, the biggest place value column, not the last digit. If she compares from the right, that is the exact misconception to address, and a place value chart makes it visible.",
  g4_doublehalf: "Doubling and halving are mental math anchors that support multiplication and division later, doubling is really multiplying by 2, halving is dividing by 2. If she has to count on her fingers for double 6, that fact is worth drilling on its own before moving on.",
  g4_fillten: "This is the mental strategy behind carrying and borrowing, knowing how far a number is from the next multiple of ten makes column addition and subtraction click. Say it out loud as a question, for example forty seven and how much more makes fifty.",
  g4_addsub: "By Term 2, Grade 4 learners are expected to add and subtract 4 digit numbers, usually with regrouping. If the column method breaks down, go back to expanded notation, writing each number out in thousands, hundreds, tens and units, before returning to the short method. Start on an easier level here if 4 digits are still shaky.",
  g4_multiply: "CAPS builds this up in stages, 2 digit by 1 digit first, then 2 digit by 2 digit. Do not move to the harder mode until the easier one is fluent, since the strategies, like breaking numbers apart, build directly on each other.",
  g4_divide: "CAPS Grade 4 introduces division as the inverse of multiplication, so if she knows that 6 times 7 is 42, she already knows that 42 divided by 6 is 7. Point that connection out explicitly. The remainder mode is a natural next step once exact division is solid.",
  g4_numsentence: "A number sentence with a missing number is algebra in disguise. Encourage her to say the sentence in words first, for example twenty four plus what number makes sixty one, rather than jumping straight to an operation.",
  g4_tables: "Multiplication and division both depend on this fluency. A few minutes of mixed recall most days beats one long weekly drill.",
  g4_comparefrac: "This is the exact CAPS Grade 4 skill, comparing fractions with different denominators using a picture, not a rule. Resist teaching a shortcut for finding common denominators yet, the visual comparison here is what builds the number sense that later shortcuts rely on.",
  g4_addfrac: "Grade 4 CAPS only expects addition and subtraction of fractions with the same denominator. If a worksheet shows different denominators, that is Grade 5 content, so it is fine to say so and come back to it later.",
  g4_length: "Millimetres, centimetres and metres are the units Grade 4 uses most, kilometres are introduced but used less often. A tape measure or metre stick at home makes these conversions concrete rather than a memorised rule.",
  g4_capacity: "Millilitres and litres are easiest to feel using real containers, an empty two litre bottle or a measuring jug is worth more than several worksheets on its own.",
  g4_mass: "Grams and kilograms work the same way as the other units, a kitchen scale is a genuinely useful manipulative here, weighing real household items builds a sense of scale a worksheet alone cannot.",
  g4_time: "CAPS places formal time work in Term 4, so if you are working through Term 2 and 3 in order this is a preview, not a repeat of something she has already covered. Reading an analogue clock still depends on place value thinking, since the minute hand jumps in groups of 5.",
  g4_shapes3d: "Flat faces versus curved surfaces is the core Grade 4 distinction. A tin can, a ball and a cereal box are all sitting in the kitchen, so this is another good topic to teach with real objects rather than only pictures. Counting edges and vertices is slightly beyond the Grade 4 wording but is good solid extension practice once faces are secure.",
  g4_symmetry: "Line symmetry is genuine Grade 4 Term 3 content. Drawing the line herself, rather than just judging a line that is already marked, is a stronger test of whether she can actually picture the mirror fold. A real mirror placed on her drawn line is still the fastest way to double check it.",
  g4_gridref: "This is the actual Grade 4 CAPS position skill, using letters across the top and numbers up the side, like a simple map or a battleships style grid. It is a different skill from describing a movement, which comes next as a bonus topic.",
  g4_angles: "This one is a preview of Grade 5, Grade 4 CAPS only covers straight versus curved sides. It is still worth introducing gently if she is ready, comparing an angle to the corner of a book, a right angle, is the easiest way in.",
  g4_translate: "This is also a preview of Grade 5, formal translations are not Grade 4 content. Grade 4 only uses alpha-numeric grid references, so treat this as an optional stretch activity rather than core practice.",
  g4_numpattern: "CAPS Grade 4 patterns either add or subtract the same amount each time, or multiply by the same amount each time. Ask her to say the rule out loud before finding the next number, guessing without a rule is not the skill being tested here. The complex level goes beyond a constant rule, which is good stretch thinking but should not be the first thing she tries.",
  g4_geopattern: "These patterns grow in a picture, not just in a list of numbers, so counting the blocks in each step by hand, out loud, before answering is more valuable here than mental arithmetic alone.",
  g4_databars: "Grade 4 data handling is still one picture or one block equals one, the many-to-one pictograph only arrives in Grade 5. Practising with a survey she could genuinely run herself, favourite fruit, pets, ways of getting to school, makes the counting and comparing feel like real information rather than a worksheet exercise.",
  g6_placevalue: "This checks whether the learner understands that a digit's value depends on its position, not just the digit itself. If they keep picking the digit rather than its column value, go back to physical bundling with base ten blocks or bundled sticks before returning to this activity.",
  g6_rounding: "Rounding depends completely on secure place value. If they get the nearest 10 right but not the nearest 100, that usually means the ones and tens boundary is solid but the tens and hundreds boundary is not yet.",
  g6_bonds: "Speed here is a stand in for automatic recall. If they are counting on their fingers instead of just knowing the answer, that is not a problem to fix in one sitting, it just means more short daily practice, five minutes at a time, works better than one long session.",
  g6_tables: "Let the learner choose easier tables first, such as 2, 5 and 10, to build confidence before adding harder ones. Getting the strategy right, like skip counting or doubling, matters more than raw speed while a fact is still new.",
  g6_factfamily: "This shows whether the learner sees addition and subtraction, or multiplication and division, as connected operations rather than four separate unrelated rules. Seeing that connection is what makes later algebra manageable.",
  g6_equivfrac: "Finding an equivalent fraction is really a multiplication skill in disguise, since the top and bottom are multiplied by the same number. If they are stuck, a fraction wall, drawn or printed, lets them see it physically first.",
  g6_fdp: "The hundred grid is the single best bridge between fractions, decimals and percentages, because all three are just different ways of describing the same shaded amount. It is worth spending real time here, even if it feels slow, since it pays off across the whole percentage and decimal unit.",
  g6_fracops: "Same denominator fractions are the easiest case, because the pieces are already the same size. This is the right place to build confidence before ever tackling fractions with different denominators.",
  g6_ratio: "Encourage the learner to draw or group real objects before writing any numbers. Ratio only really clicks once it is felt physically as groups, not just as a colon between two digits.",
  g6_shapes: "This depends less on shaky number sense and more on memorised properties, so it is a good confidence booster to use on a harder day.",
  g6_mirror: "Reflections are about position, not calculation, so this is another good low pressure topic. If they struggle, physically fold a piece of paper in half and let them watch the mirror image appear as you unfold it.",
  g6_databars: "Data handling works best with real, personally meaningful data. If the learner is involved in collecting the information themselves, reading the finished graph becomes far more motivating than a ready made worksheet.",
  g6_wordprobs: "These combine several skills in one question, which is exactly what a test will do. If the maths is right but the answer is still wrong, that is often a reading comprehension issue, so read the question aloud together first.",
  g6_areaperim: "Grade 6 moves on from counting squares towards the formulas, perimeter as 2 times length plus width, area as length times width, and irregular or L-shaped figures built from rectangles. Tying every question to a real object, a garden, a floor, a frame, makes the formula feel like a tool rather than an abstract rule.",
  g6_stats: "Double bar graphs and median are the two genuinely new pieces at Grade 6, comparing two data sets side by side, and finding the middle value once a list is ordered. Median only works once the data is sorted, so physically writing the numbers out from smallest to largest before answering is worth more than any shortcut.",
  g5_placevalue: "Grade 5 extends place value to 6 digit numbers, one more column than Grade 4's 4 digit range. If a learner is shaky here, check 4 digit Grade 4 place value first before pushing into hundreds of thousands.",
  g5_addsub: "5 digit column addition and subtraction leans hard on regrouping across several columns in a row. Expanded notation, writing out thousands, hundreds, tens and units separately, is still the best fallback if the short method breaks down.",
  g5_multiply: "3 digit by 2 digit multiplication is usually taught by breaking one number into parts, for example 234 times 16 as 234 times 10 plus 234 times 6. Encourage that breakdown out loud before reaching for a written algorithm.",
  g5_divide: "This extends Grade 4's 3 digit by 1 digit division to a 2 digit divisor. Estimating first, for example roughly how many times does 23 go into 480, builds the number sense that makes the exact working easier.",
  g5_fracmixed: "Mixed numbers combine a whole number with a fraction. The most common error is forgetting to carry a whole number when the fraction part adds up to more than 1, so it is worth checking that specific step separately.",
  g5_decimals: "This checks decimal comparison, not calculation. A common misconception is treating a decimal like a whole number, for example thinking 4.9 is smaller than 4.15 because 9 is a smaller looking last digit than 15. Line the digits up in columns to make the mistake visible.",
  g5_area: "Counting squares is the concrete foundation underneath the area formulas that come later. If a learner is fluent here, the leap to length times width for a rectangle becomes obvious rather than a rule to memorise.",
  g5_time: "Converting between 12 hour and 24 hour time is really just adding or subtracting 12 hours once past midday. A learner who separately knows their times tables and place value sometimes still trips on this simply from unfamiliarity, so repetition helps more than explanation here.",
  g5_angles: "Naming angle categories depends on comparing to a right angle, exactly like Grade 4, just with more categories added. A real right angle, like the corner of a book, is still the best physical reference point.",
  g5_transform: "This is a vocabulary and visualisation skill rather than a calculation. Acting the movement out physically, sliding, flipping or turning an actual object, makes the difference between the three types far more obvious than reading a description.",
  g5_shapes2d: "This is the same property recall skill as Grade 4's shape quiz, extended with the heptagon. If a learner has the Grade 4 shapes solid, this is mostly just one new name to learn.",
  g5_numpattern: "Grade 5 patterns can change their own rule partway through, for example the gap between numbers growing each time. Get the learner to write the gaps between each pair of numbers underneath the sequence, that written trail usually reveals the rule.",
  g5_databars: "Grade 5 introduces the many-to-one pictograph, where one picture can stand for 2, 5 or more, so reading the key first is now a non-negotiable habit, not a nice-to-have. Mode is also new here, the value that comes up most in a real list of numbers or answers, which is a much more concrete idea than it sounds once she has sorted a few lists by hand.",
  fp_counting: "Before, after and between questions check genuine number order understanding, not just rote counting. If a learner can recite numbers in order but struggles here, that is a sign the counting is not yet connected to real number sense.",
  fp_addsub: "The exact number range matters a lot at this stage, working within 20 confidently is a real achievement and should not be rushed past. Concrete counters, fingers, or a number line are appropriate tools here, not a shortcut to be phased out too early.",
  fp_skipcount: "Skip counting is the informal root of later multiplication tables, counting in 2s, 5s and 10s especially. Saying the count out loud while pointing at real objects, like pairs of shoes for 2s, builds the connection between the words and the quantity.",
  fp_shapes: "Sorting by straight versus curved sides is the Foundation Phase entry point into geometry, well before formal names like quadrilateral are needed. Real household objects, a ball, a box, a plate, are more useful here than pictures alone.",
  fp_patterns: "Copying and extending a pattern is early algebraic thinking, noticing and continuing a rule. If a learner cannot say what repeats, physically laying out real objects, buttons or blocks, in the pattern often makes the repeating unit click.",
  fp_measure: "At this stage, comparison language, longer, shorter, heavier, lighter, matters more than any number or unit. Formal units like centimetres and kilograms are introduced later and should sit on top of solid comparison skills, not replace them.",
  fp_money: "South African coins and notes are the actual objects used here, since money is one of the few maths topics with genuine everyday relevance for a young child. Real or play money in hand is far more effective than a picture on a screen.",
  fp_data: "Reading a one to one pictograph is the entry point into all later data handling and graph work. The skill being checked is careful counting and comparing, not any calculation.",
  fp_bonds: "Number bonds, knowing all the pairs that make a target number, are one of the single most important foundations for mental maths later on. A child who knows bonds to 10 instantly can use that knowledge to solve much bigger problems without counting on their fingers.",
  fp_tenframe: "The ten frame is a visual model, not just a game screen. It builds an instant sense of quantity, called subitising, and lays the groundwork for understanding place value once numbers pass 10. Physical counters on a printed ten frame work just as well as clicking here.",
  fp_renaming: "Renaming, also called partitioning, a number into tens and units, or hundreds tens and units, is what makes column addition and subtraction make sense later. Without this, regrouping and borrowing are just memorised steps with no meaning behind them.",
  fp_grid100: "A hundred grid builds a mental map of how numbers relate to each other, ten more, ten less, one more, one less, patterns down columns and along rows. A learner who struggles to fill gaps here likely needs more time with a real, physical hundred chart.",
  fp_time: "Reading an analogue clock is a genuinely difficult skill that combines two separate scales, hours and minutes, moving at the same time. Moving in stages, o'clock, then half past, then quarter past and to, before mixing them matters more here than almost anywhere else in the curriculum.",
  fp_pyramid: "This is number bonds in a puzzle format, useful for a child who finds plain drill worksheets dull. Working from the bottom up or the top down are both valid strategies, watch which way a learner naturally reaches for the missing brick.",
  fp_position: "Position and direction language, in front, behind, between, first, last, is core Foundation Phase vocabulary that is easy to overlook because it never gets its own worksheet. A child can be strong at counting yet still genuinely confused by these words, they need to be taught and practised directly, not assumed.",
  fp_shapenames: "Naming shapes correctly and counting sides are two separate skills bundled into one activity here. A learner might recognise a triangle by sight long before they can reliably count that it has exactly 3 sides, both are worth checking on their own.",
  fp_picgraph: "This is the same picture graph skill as the pictograph activity, but drawn as vertical stacks instead of horizontal rows, which is the other common layout a child will meet in a workbook or test. Being comfortable with both layouts matters more than it might seem.",
  fp_breakup: "Breaking up (also called breaking down) numbers by place value is a named CAPS mental strategy taught right through Grade 1 to 3. It works by splitting both numbers into tens and units, working with each part separately, then combining the parts, and it is deliberately checked step by step here rather than just marking the final answer, since the method itself is the skill being built.",
  fp_bridge10: "Building up, or bridging through 10, is the standard CAPS strategy for adding within 20 once a child is comfortable with number bonds to 10. The method only really works if the first part added is specifically the amount needed to reach 10, so this activity checks that specific split, not just any two numbers that happen to add up correctly.",
  fp_doublehalve: "Doubling and halving is listed in CAPS alongside building up and breaking down as a core mental strategy for Grades 1 to 3. The two break up modes here extend the same idea to bigger numbers, doubling or halving each part separately before combining, which is a natural bridge toward multiplication and division facts.",
  fp_column: "A caveat worth knowing: the formal written column method with carrying and borrowing is common classroom practice by Grade 3 in South Africa, but I could not confirm it as an official CAPS Foundation Phase requirement in the policy document itself, it reads as more a Grade 4 topic. It is included here labelled as a Grade 3 to 4 bridge rather than core Grade 3 content, worth keeping in mind if you are working strictly to the Grade 3 CAPS scope.",
  g7_notation: "Levels 7 and 8 switch curriculum, they follow the National Curriculum for England (Key Stage 3, roughly Year 7 and Year 8), not CAPS, since that is what was asked for. Algebraic notation is usually a learner's first real encounter with letters standing for numbers, ab meaning a times b trips up almost everyone at first, so this is worth sitting alongside her rather than assuming the convention is obvious.",
  g7_equations: "Solving an equation is really just undoing operations in reverse order, whatever was done last to build the equation gets undone first. Learners who can already balance number bonds mentally often resist writing out each step, but the written steps are what will carry them through harder, multi-step equations later.",
  g7_sequences: "Finding the nth term formula for a linear sequence is a genuinely abstract leap, from a Grade 4 style number pattern where you just find the next number. The key habit worth building is finding the common difference first, that number becomes the coefficient of n in the formula.",
  g7_directed: "Directed number arithmetic, especially two negatives multiplying to make a positive, is memorised as a rule far more often than it is understood, and that is fine at this stage. A number line is still the most honest way to check an answer if either of you is unsure.",
  g7_bodmas: "BODMAS order of operations calculations are a common source of careless errors even in learners who are otherwise strong, mostly from working left to right out of habit instead of checking for brackets and powers first. Slowing down to label each step with which operation it is tends to fix this faster than more practice alone.",
  g7_factors: "HCF and LCM are two genuinely different questions that get confused constantly, highest common factor asks what divides into both numbers, lowest common multiple asks what both numbers divide into. Listing the factors or multiples of each number separately before comparing is the most reliable method at this stage, faster tricks can come later.",
  g7_angles: "These angle facts, a straight line is 180°, a full turn is 360°, angles in a triangle sum to 180°, are the toolkit for almost every geometry problem from here on. Encourage writing down which fact is being used for each step, since that is what a written exam answer actually needs to show.",
  g7_coordinates: "Working in all four quadrants means negative coordinates appear for the first time, and mixing up which axis is which, or the order of the pair, is an extremely common slip. A quick physical reminder, along the corridor then up the stairs, for x then y, still helps at this stage.",
  g7_probability: "The National Curriculum introduces probability formally in Key Stage 3, this is likely her first proper encounter with it, unlike the rest of this app's content it is not a bridge from something she already knows. Probability as a fraction between 0 and 1, and all outcomes summing to 1, are the two ideas worth anchoring before anything more complex.",
  g8_expand: "Expanding a bracket is multiplying every term inside it by whatever is outside, a very common error is only multiplying the first term. Checking the answer by substituting a simple number, like 2, into both the original and expanded expression and confirming they match is a good independent check.",
  g8_equations2: "Equations with brackets are usually best solved by expanding the bracket first, then solving as before, though some learners prefer dividing through instead, both are valid. The real skill being tested here is choosing and sticking with one clear method rather than mixing approaches partway through.",
  g8_ratio: "Ratio and direct proportion are closely related but asked about differently, ratio problems usually give a total to split, proportion problems usually give one pair of matching values and ask for another. Reducing a ratio to its simplest form first almost always makes the arithmetic that follows easier.",
  g8_percentchange: "Percentage increase and decrease problems are prone to a specific error, working out the percentage of the original amount and then forgetting to add or subtract it from that original amount. Writing out both steps separately, rather than trying to do it in one move, prevents that.",
  g8_speed: "Speed, distance and time problems all come from the same one relationship, distance equals speed times time, just rearranged depending on what is missing. The speed triangle is a memory aid for that rearranging, not a separate fact to learn.",
  g8_powers: "Standard form is really just a compact way of writing very large or very small numbers, the power of 10 tells you how many places the decimal point moves. If a learner can already do this by counting zeros, connecting that instinct to the formal A times 10 to the n notation is the main job here.",
  g8_circles: "Circumference and area of a circle both use pi, but for different reasons, circumference is a length, so it involves the diameter directly, area involves the radius squared. Learners frequently apply the wrong formula, or use the diameter where the radius was needed, so checking which measurement was given is worth doing before calculating.",
  g8_pythagoras: "Pythagoras' theorem only works on right-angled triangles, and the hypotenuse, the longest side opposite the right angle, must be correctly identified before starting. A common error is subtracting instead of adding the two squares when finding the hypotenuse itself, or the reverse when finding a shorter side.",
  g8_enlarge: "Enlargement by a scale factor greater than 1 makes a shape bigger, a scale factor between 0 and 1 makes it smaller, which surprises many learners the first time they meet it. Every length on the original shape gets multiplied by the same scale factor, that consistency is the property worth checking on any answer.",
};
function tutorHTML(key) {
  // Same rule as backBtn/levelNote: Levels 7 and 8 are UK content and stay
  // English even when the profile language is Afrikaans, so this uses the
  // showAf guard rather than a plain tr().
  //
  // Only the toggle is translated. TUTOR_NOTES itself has no Afrikaans
  // version, so the panel behind it stays English for now.
  const showAf = currentLang === 'af' && currentLevel !== '7' && currentLevel !== '8';
  const label = showAf
    ? 'Vir die tutor: wat hier eintlik geoefen word'
    : 'For the tutor: what this is really practising';
  return `
    <div class="tutor-box">
      <button class="tutor-toggle" onclick="toggleTutor('${key}')">${label}</button>
      <div class="tutor-panel" id="tutor-${key}">${TUTOR_NOTES[key]}</div>
    </div>
  `;
}
function toggleTutor(key) {
  const panel = document.getElementById('tutor-' + key);
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function renderLevelTabs() {

  document.getElementById('level-tabs').innerHTML = levelBtns + manipBtn;
}
function setLevel(l) { currentLevel = l; renderLevelTabs(); renderHome(); window.scrollTo(0, 0); }
function goToManipulatives() { currentLevel = 'manipulatives'; renderLevelTabs(); renderManipulatives(); window.scrollTo(0, 0); }

function renderHome() {
  renderLevelTabs();
  const profile = mathitGetActiveProfile();
  let html = profile ? mathitGreetingBannerHTML(profile) : '';
  SECTIONS_BY_LEVEL[currentLevel].forEach(sec => {
    const secTitle = currentLang === 'af' && SECTION_TITLES_AF[sec.title] ? SECTION_TITLES_AF[sec.title] : sec.title;
    html += `<div class="section-heading">${secTitle}</div><div class="grid">`;
    sec.keys.forEach((key, i) => {
      const a = ACTIVITIES[key];
      const aAf = ACTIVITIES_AF[key];
      const useAf = currentLang === 'af' && aAf;
      const c = BEACH[i % BEACH.length];
      const badgeText = useAf && aAf.badgeAf ? aAf.badgeAf : a.badge;
      html += `
        <div class="tile" style="--tile-color: var(--${c}); --tile-bg: var(--${c}-light);" onclick="goTo('${key}')">
          <div class="dot">${a.icon}</div>
          <div><h3>${useAf ? aAf.title : a.title}</h3><p>${useAf ? aAf.desc : a.desc}</p>${badgeText ? `<div class="badge">${badgeText}</div>` : ''}</div>
        </div>
      `;
    });
    html += `</div>`;
  });
  app.innerHTML = html;
}

// =====================================================================
// WELCOME / SIGN-IN / STREAK
// Each student signs in as themselves through Keycloak, and their profile
// and progress live in the MathIT database rather than on the device. That
// is what keeps one student from seeing another's work: the API derives the
// student from the access token, so there is no device-local list of
// children for anyone to browse.
//
// The mathit*Profile* helpers below keep their original names and shapes so
// the rest of the app (which calls them in a dozen places) did not need to
// change; only what backs them did.
// =====================================================================

// The signed-in student, as returned by GET /api/me. Null when signed out.
let mathitServerProfile = null;

function mathitLoadProfiles() {
  return mathitServerProfile ? [mathitServerProfile] : [];
}

/**
 * Pushes profile edits (name, birthday, language) back to the server.
 * Fire-and-forget: a failed sync must never interrupt a child mid-practice,
 * and the next successful call will carry the current values anyway.
 */
function mathitSaveProfiles(profiles) {
  const p = profiles && profiles[0];
  if (!p || !window.MathITAuth || !MathITAuth.isSignedIn()) return;
  MathITAuth.updateProfile({
    name: p.name,
    birthday: p.birthday || null,
    language: p.language === 'af' ? 'af' : 'en',
  }).then(updated => { mathitServerProfile = mathitAdaptProfile(updated); })
    .catch(err => console.warn('could not save profile:', err.message));
}

function mathitGetActiveName() {
  return mathitServerProfile ? mathitServerProfile.name : null;
}

/** Signing out is the only way to "switch student" now. */
function mathitSetActiveName(name) {
  if (!name && window.MathITAuth) MathITAuth.logout();
}

function mathitGetActiveProfile() {
  return mathitServerProfile;
}

/** Maps the API shape onto the profile shape the app already expects. */
function mathitAdaptProfile(api) {
  if (!api) return null;
  return {
    name: api.name || api.username,
    username: api.username,
    birthday: api.birthday || null,
    language: api.language === 'af' ? 'af' : 'en',
    streak: api.streak || 0,
    lastPracticeDate: api.lastPracticeDate || null,
    status: api.status,
    isAdmin: Array.isArray(api.roles) && api.roles.includes('admin'),
  };
}
function mathitTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// The streak is now advanced by the server, inside the same transaction that
// records an answered question (see POST /api/me/practice). Doing it here as
// well would double-count, and a device with a wrong clock could inflate it.
// Kept as a no-op so the existing call sites read the same as before.
function mathitUpdateStreak(profile) {
  return profile;
}
function mathitIsBirthdayToday(profile) {
  if (!profile.birthday) return false;
  const bday = new Date(profile.birthday + 'T00:00:00');
  if (isNaN(bday.getTime())) return false;
  const today = new Date();
  return bday.getMonth() === today.getMonth() && bday.getDate() === today.getDate();
}
function mathitGreetingBannerHTML(profile) {
  const isBday = mathitIsBirthdayToday(profile);
  const streak = profile.streak || 0;
  const streakLine = streak > 1
    ? tr(`🔥 ${streak} day streak. Keep it going!`, `🔥 ${streak} dae se reeks. Hou so aan!`)
    : (streak === 1 ? tr(`🔥 Day 1 of your streak. Nice start!`, `🔥 Dag 1 van jou reeks. Goeie begin!`) : '');
  return `
    <div class="card" style="margin-bottom: 18px; text-align:center;">
      <h2 style="margin:0 0 4px 0; color:var(--ocean-dark);">${isBday ? tr(`🎂 Happy Birthday, ${esc(profile.name)}!`, `🎂 Veels geluk met jou verjaardag, ${esc(profile.name)}!`) : tr(`Welcome back, ${esc(profile.name)}!`, `Welkom terug, ${esc(profile.name)}!`)}</h2>
      ${streakLine ? `<p class="subtext" style="margin:4px 0 0 0;">${streakLine}</p>` : ''}
      <div style="margin-top:8px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;">
        <button class="mathit-switch-link" style="color:var(--ocean-dark);" onclick="mathitSwitchProfile()">${tr(`Not ${esc(profile.name)}? Sign out`, `Nie ${esc(profile.name)} nie? Teken uit`)}</button>
        <span style="display:inline-flex; gap:4px;">
          <button class="secondary small" style="${currentLang === 'en' ? 'opacity:1;' : 'opacity:0.5;'}" onclick="mathitSetLang('en')">EN</button>
          <button class="secondary small" style="${currentLang === 'af' ? 'opacity:1;' : 'opacity:0.5;'}" onclick="mathitSetLang('af')">AF</button>
        </span>
      </div>
    </div>

}

function mathitChooseProfile() {
  const profile = mathitGetActiveProfile();
  if (!profile) { mathitRenderWelcome(); return; }
  currentLang = profile.language === 'af' ? 'af' : 'en';
  mathitRenderHeaderGreeting();
  currentLevel = '4';
  renderLevelTabs();
  renderHome();
  window.scrollTo(0, 0);
}

/** "Switch student" means a full sign-out, so no session leaks to the next child. */
function mathitSwitchProfile() {
  MathITAuth.logout();
}

async function mathitInit() {
  renderLevelTabs();
  currentLang = 'en';

  let api = null;
  try {
    api = await MathITAuth.init();
  } catch (err) {
    mathitRenderHeaderGreeting();
    app.innerHTML = `<div class="card welcome-card">
      <h2 class="activity-title" style="justify-content:center;">Cannot reach MathIT</h2>
      <p class="subtext">${esc(err.message)}</p>
      <button class="action" style="margin-top:16px;" onclick="location.reload()">Try again</button>
    </div>`;
    return;
  }

  if (!api) {                       // signed out
    mathitRenderHeaderGreeting();
    mathitRenderWelcome();
    return;
  }

  mathitServerProfile = mathitAdaptProfile(api);

  if (mathitServerProfile.status !== 'active') {
    mathitRenderHeaderGreeting();
    mathitRenderPending(mathitServerProfile);
    return;
  }

  mathitChooseProfile();
}

// Every activity keeps its own {correct, attempted} state object and calls
// scoreHTML() right after marking an answer. That makes scoreHTML the one
// place all ~40 activities pass through, so progress is reported from here
// rather than by editing each activity's check function.
const mathitReportedScores = new WeakMap();

function mathitReportProgress(state) {
  if (!state || typeof state.attempted !== 'number') return;

  const prev = mathitReportedScores.get(state) || { attempted: 0, correct: 0 };
  const dAttempted = state.attempted - prev.attempted;
  const dCorrect = state.correct - prev.correct;
  mathitReportedScores.set(state, { attempted: state.attempted, correct: state.correct });

  // Nothing new (first render, or the activity reset its counters).
  if (dAttempted <= 0) return;
  if (!window.MathITAuth || !MathITAuth.isSignedIn()) return;

  MathITAuth.recordPractice({
    topic: (typeof currentActivityKey === 'string' && currentActivityKey) || 'unknown',
    level: String(typeof currentLevel === 'undefined' ? '' : currentLevel),
    correct: dCorrect > 0,
  }).then(res => {
    // Keep the header streak badge in step with the server's count.
    if (res && typeof res.streak === 'number' && mathitServerProfile
        && mathitServerProfile.streak !== res.streak) {
      mathitServerProfile.streak = res.streak;
      mathitRenderHeaderGreeting();
    }
  }).catch(err => console.warn('could not record practice:', err.message));
}

function scoreHTML(state) {
  mathitReportProgress(state);
  const profile = mathitGetActiveProfile();
  const showAf = currentLang === 'af' && currentLevel !== '7' && currentLevel !== '8';
  const label = profile ? (showAf ? `${esc(profile.name)} se telling` : `${esc(profile.name)}'s score`) : (showAf ? 'Telling' : 'Score');
  return `<span class="scorepill">${label}: ${state.correct} ${showAf ? 'van' : 'of'} ${state.attempted}</span>`;
}

function fp_newCNQuestion() {
  const max = FP_CN_MAX[fp_cnState.level];
  const sub = pick(['after', 'before', 'between']);
  let text, answer;
  if (sub === 'after') { const n = randInt(1, max - 1); text = tr(`What number comes right after ${n}?`, `Watter getal kom net na ${n}?`); answer = n + 1; }
  else if (sub === 'before') { const n = randInt(2, max); text = tr(`What number comes right before ${n}?`, `Watter getal kom net voor ${n}?`); answer = n - 1; }
  else { const n = randInt(1, max - 2); text = tr(`What number comes between ${n} and ${n + 2}?`, `Watter getal kom tussen ${n} en ${n + 2}?`); answer = n + 1; }
  fp_cnState.answer = answer;

  `;

  const v = parseInt(document.getElementById('fpcn-in').value);
  fp_cnState.attempted++;
  const fb = document.getElementById('fpcn-feedback');
  if (v === fp_cnState.answer) {

    fb.textContent = tr('Correct! Next one.', 'Reg! Volgende een.');
    const btn = document.querySelector('#fpcn-question .action');
    if (btn) btn.onclick = null;
    setTimeout(fp_newCNQuestion, 800);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The answer was ${fp_cnState.answer}.`, `Nie heeltemal reg nie. Die antwoord was ${fp_cnState.answer}.`);
  }
  document.getElementById('fpcn-score').innerHTML = scoreHTML(fp_cnState);
}

function fp_formatCents(c) {

  `;

function fp_checkMN() {
  const raw = (document.getElementById('fpmn-in').value || '').trim().toUpperCase();
  fp_mnState.attempted++;
  const fb = document.getElementById('fpmn-feedback');
  let cents = null;
  if (raw.startsWith('R') && raw.includes('.')) {
    const [r, c] = raw.slice(1).split('.');
    cents = (parseInt(r) || 0) * 100 + (parseInt((c + '00').slice(0,2)) || 0);
  } else if (raw.startsWith('R')) {
    cents = (parseInt(raw.slice(1)) || 0) * 100;
  } else if (raw.includes('.')) {
    const [r, c] = raw.split('.');
    cents = (parseInt(r) || 0) * 100 + (parseInt((c + '00').slice(0,2)) || 0);
  } else {
    // bare number (with or without a trailing c) is treated as a cent total, matching the placeholder example
    cents = parseInt(raw);
  }
  const answerText = fp_formatCents(fp_mnState.answer);
  if (cents === fp_mnState.answer) {
    fp_mnState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr(`Correct! That is ${answerText}. Next one.`, `Reg! Dit is ${answerText}. Volgende een.`);
    setTimeout(fp_newMNQuestion, 1100);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The total was ${answerText}.`, `Nie heeltemal reg nie. Die totaal was ${answerText}.`);
  }
  document.getElementById('fpmn-score').innerHTML = scoreHTML(fp_mnState);
}

function fp_timeLabel(h, m) {
  if (m === 0) return tr(`${h} o'clock`, `${h} uur`);
  if (m === 30) { const next = (h % 12) + 1; return tr(`half past ${h}`, `half ${next}`); }
  if (m === 15) return tr(`quarter past ${h}`, `kwart oor ${h}`);
  if (m === 45) { const next = (h % 12) + 1; return tr(`quarter to ${next}`, `kwart voor ${next}`); }
  return `${h}:${String(m).padStart(2, '0')}`;
}
// Lenient parser for the "Type the Time" mode: accepts "3", "3:00", "3.00", "0300", etc.
function fp_parseTimeInput(str) {
  if (!str) return null;
  const cleaned = str.trim().toLowerCase().replace(/\s+/g, '').replace(/(am|pm)$/, '');
  const match = cleaned.match(/^(\d{1,2})[:.h]?(\d{0,2})$/);
  if (!match) return null;
  const h = parseInt(match[1], 10);
  const m = match[2] ? parseInt(match[2], 10) : 0;
  if (isNaN(h) || isNaN(m) || h < 1 || h > 12 || m < 0 || m > 59) return null;
  return { h, m };
}

  document.getElementById('fpcl-mode-sub').classList.toggle('correct', fp_clState.mode === 'sub');

function fp_clStack(a, b, sign) {
  const pad = (n) => String(n).padStart(2, ' ');
  return `
    <div style="font-family:'Courier New', monospace; font-size:1.6rem; text-align:right; display:inline-block; line-height:1.5;">
      <div>&nbsp;&nbsp;${pad(a)}</div>
      <div>${sign} ${pad(b)}</div>
      <div style="border-top:3px solid var(--ocean-dark); margin-top:2px;">&nbsp;</div>
    </div>
  `;
}
function fp_newCLQuestion() {
  document.getElementById('fpcl-feedback').className = 'feedback';
  if (fp_clState.mode === 'add') {
    const unitsA = randInt(1, 9);
    const unitsB = randInt(Math.max(1, 10 - unitsA), 9);
    const tensA = randInt(1, 7);
    const tensB = randInt(1, 8 - tensA);
    const a = tensA * 10 + unitsA, b = tensB * 10 + unitsB;
    fp_clState.a = a; fp_clState.b = b;
    const unitsSum = unitsA + unitsB;
    const tensSum = tensA + tensB + 1;
    fp_clState.answer = [unitsSum, tensSum, a + b];
    document.getElementById('fpcl-question').innerHTML = `
      ${fp_clStack(a, b, '+')}
      <div class="q-box" style="font-size:1.2rem;">
        ${tr(`Units column: ${unitsA} + ${unitsB} =`, `Eenhede-kolom: ${unitsA} + ${unitsB} =`)} <input type="number" id="fpcl-in0" style="width:60px;" autofocus /> ${tr('(write down the last digit, carry the ten)', '(skryf die laaste syfer neer, dra die tien oor)')}<br/>
        ${tr(`Tens column: ${tensA} + ${tensB} + 1 (the carried ten) =`, `Tiene-kolom: ${tensA} + ${tensB} + 1 (die oorgedraagde tien) =`)} <input type="number" id="fpcl-in1" style="width:60px;" /><br/>
        ${tr('Final answer:', 'Finale antwoord:')} <input type="number" id="fpcl-in2" style="width:80px;" />
      </div>
      <button class="action" onclick="fp_checkCL()">${tr('Check', 'Gaan na')}</button>
      <button class="secondary" onclick="fp_newCLQuestion()">${tr('New problem', 'Nuwe probleem')}</button>
    `;
  } else {
    const unitsA = randInt(0, 8);
    const unitsB = randInt(unitsA + 1, 9);
    const tensA = randInt(2, 9);
    const tensB = randInt(1, tensA - 1);
    const a = tensA * 10 + unitsA, b = tensB * 10 + unitsB;
    fp_clState.a = a; fp_clState.b = b;
    const unitsDiff = (unitsA + 10) - unitsB;
    const tensDiff = (tensA - 1) - tensB;
    fp_clState.answer = [unitsDiff, tensDiff, a - b];
    document.getElementById('fpcl-question').innerHTML = `
      ${fp_clStack(a, b, '-')}
      <div class="q-box" style="font-size:1.2rem;">
        ${tr(`${unitsA} is smaller than ${unitsB}, so rename: borrow a ten from the tens column.`, `${unitsA} is kleiner as ${unitsB}, dus hernoem: leen 'n tien van die tiene-kolom.`)}<br/>
        ${tr(`Units column: (${unitsA} + 10) - ${unitsB} =`, `Eenhede-kolom: (${unitsA} + 10) - ${unitsB} =`)} <input type="number" id="fpcl-in0" style="width:60px;" autofocus /><br/>
        ${tr(`Tens column: (${tensA} - 1) - ${tensB} =`, `Tiene-kolom: (${tensA} - 1) - ${tensB} =`)} <input type="number" id="fpcl-in1" style="width:60px;" /><br/>
        ${tr('Final answer:', 'Finale antwoord:')} <input type="number" id="fpcl-in2" style="width:80px;" />
      </div>
      <button class="action" onclick="fp_checkCL()">${tr('Check', 'Gaan na')}</button>
      <button class="secondary" onclick="fp_newCLQuestion()">${tr('New problem', 'Nuwe probleem')}</button>
    `;
  }
}

let g4_pvState = { correct: 0, attempted: 0, answer: null };
function g4_renderPlaceValue() {
  g4_pvState = { correct: 0, attempted: 0, answer: null };
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2 class="activity-title">🔢 ${tr('Place Value Explorer', 'Plekwaarde-ontdekker')}</h2>
      <p class="subtext">${tr('What is the <em>value</em> of the highlighted digit? Not just its name, its real value in the number.', 'Wat is die <em>waarde</em> van die uitgeligte syfer? Nie net sy naam nie, sy werklike waarde in die getal.')}</p>
      ${tutorHTML('g4_placevalue')}
      <div id="pv-score">${scoreHTML(g4_pvState)}</div>
      <div id="pv-question"></div>
      <div id="pv-feedback" class="feedback"></div>
    </div>
  `;
  g4_newPVQuestion();
}
function g4_newPVQuestion() {
  const num = randInt(1000, 9999);
  const numStr = String(num);
  const pos = randInt(0, 3);
  const digit = parseInt(numStr[pos]);
  const placeValueExp = numStr.length - 1 - pos;
  const correct = digit * Math.pow(10, placeValueExp);
  g4_pvState.answer = correct;
  const display = numStr.split('').map((d, i) => i === pos ? `<span style="color:#E11D48; text-decoration:underline;">${d}</span>` : d).join('');
  let options = [correct, digit, correct + Math.pow(10, placeValueExp), Math.max(1, correct - Math.pow(10, placeValueExp))];
  options = [...new Set(options)];
  while (options.length < 4) options.push(correct + randInt(1, 9));
  const finalOpts = shuffle(options.slice(0, 4));
  document.getElementById('pv-question').innerHTML = `
    <div class="q-box">${tr(`In the number <strong>${display}</strong>, what is the value of the underlined digit?`, `In die getal <strong>${display}</strong>, wat is die waarde van die onderstreepte syfer?`)}</div>
    <div class="mcq-opts">${finalOpts.map(o => `<div class="mcq-opt" onclick="g4_checkPV(this, ${o})">${o.toLocaleString('en-ZA').replace(/,/g,' ')}</div>`).join('')}</div>
    <button class="secondary small" onclick="g4_newPVQuestion()">${tr('Skip, new number', 'Slaan oor, nuwe getal')}</button>
  `;
  document.getElementById('pv-feedback').className = 'feedback';
}
function g4_checkPV(el, val) {
  g4_pvState.attempted++;
  const opts = document.querySelectorAll('#pv-question .mcq-opt');
  const fb = document.getElementById('pv-feedback');
  if (val === g4_pvState.answer) {
    g4_pvState.correct++;
    el.classList.add('correct');
    fb.className = 'feedback good';
    fb.textContent = tr('Yes, that is right! New question loading.', 'Ja, dit is reg! Nuwe vraag laai.');
    opts.forEach(o => o.onclick = null);
    setTimeout(g4_newPVQuestion, 1100);
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = tr(`Not quite. The correct value is ${g4_pvState.answer.toLocaleString('en-ZA').replace(/,/g,' ')}. Look at which column that digit sits in.`, `Nie heeltemal reg nie. Die korrekte waarde is ${g4_pvState.answer.toLocaleString('en-ZA').replace(/,/g,' ')}. Kyk in watter kolom daardie syfer sit.`);
    opts.forEach(o => o.onclick = null);
  }
  document.getElementById('pv-score').innerHTML = scoreHTML(g4_pvState);
}

  document.getElementById('dv-mode-exact').classList.toggle('correct', g4_dvState.mode === 'exact');
  document.getElementById('dv-mode-rem').classList.toggle('correct', g4_dvState.mode === 'remainder');
}
function g4_newDVQuestion() {
  const divisor = randInt(2, 9);
  let quotient, dividend, remainder = 0;
  if (g4_dvState.mode === 'exact') {
    do { quotient = randInt(12, 99); dividend = divisor * quotient; } while (dividend < 100 || dividend > 999);
  } else {
    do {
      quotient = randInt(12, 99);
      remainder = randInt(1, divisor - 1);
      dividend = divisor * quotient + remainder;
    } while (dividend < 100 || dividend > 999);
  }
  g4_dvState.answer = quotient; g4_dvState.remainder = remainder;
  document.getElementById('dv-question').innerHTML = `
    <div class="q-box">${dividend} &divide; ${divisor} = ___ ${g4_dvState.mode === 'remainder' ? tr('remainder ___', 'res ___') : ''}</div>

  const v = parseInt(document.getElementById('dv-in').value);
  const remEl = document.getElementById('dv-rem');
  const r = remEl ? parseInt(remEl.value) : 0;
  g4_dvState.attempted++;
  const fb = document.getElementById('dv-feedback');
  const ok = g4_dvState.mode === 'exact' ? (v === g4_dvState.answer) : (v === g4_dvState.answer && r === g4_dvState.remainder);
  if (ok) {
    g4_dvState.correct++;
    fb.className = 'feedback good';
    fb.textContent = tr('Correct! Next one.', 'Reg! Volgende een.');
    setTimeout(g4_newDVQuestion, 900);
  } else {

    fb.textContent = g4_dvState.mode === 'exact' ? tr(`Not quite. The answer was ${g4_dvState.answer}.`, `Nie heeltemal reg nie. Die antwoord was ${g4_dvState.answer}.`) : tr(`Not quite. The answer was ${g4_dvState.answer} remainder ${g4_dvState.remainder}.`, `Nie heeltemal reg nie. Die antwoord was ${g4_dvState.answer} res ${g4_dvState.remainder}.`);
  }
  document.getElementById('dv-score').innerHTML = scoreHTML(g4_dvState);
}

let g4_tmState = { correct: 0, attempted: 0, answerMin: null, mode: 'read' };
function g4_clockSVG(h, m) {
  const hourAngle = (h % 12) * 30 + m * 0.5;
  const minAngle = m * 6;
  const cx = 60, cy = 60, r = 54;
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const ang = i * 30 * Math.PI / 180;
    const x1 = cx + (r - 6) * Math.sin(ang), y1 = cy - (r - 6) * Math.cos(ang);
    const x2 = cx + r * Math.sin(ang), y2 = cy - r * Math.cos(ang);
    ticks.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0284C7" stroke-width="2"/>`);
  }
  const numbers = [];
  for (let n = 1; n <= 12; n++) {
    const ang = n * 30 * Math.PI / 180;
    const nr = r - 17;
    const nx = cx + nr * Math.sin(ang), ny = cy - nr * Math.cos(ang);
    numbers.push(`<text x="${nx}" y="${ny + 4.5}" text-anchor="middle" font-size="11" font-weight="800" fill="#075985">${n}</text>`);
  }
  const hx = cx + 28 * Math.sin(hourAngle * Math.PI / 180), hy = cy - 28 * Math.cos(hourAngle * Math.PI / 180);
  const mx = cx + 42 * Math.sin(minAngle * Math.PI / 180), my = cy - 42 * Math.cos(minAngle * Math.PI / 180);
  return `<svg width="140" height="140" viewBox="0 0 120 120">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#075985" stroke-width="3"/>
    ${ticks.join('')}
    ${numbers.join('')}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#075985" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#075985"/>
  </svg>`;
}

// ---- Shared draggable clock-hands component, used by "Set the Time" modes ----
// (kept separate from the Manipulatives clock so each quiz activity gets its own
// independent state and DOM ids, but reuses the same drag mechanics.)
function qclk_pointerInfo(svgId, evt) {
  const svg = document.getElementById(svgId);
  const rect = svg.getBoundingClientRect();
  const scaleX = 300 / rect.width, scaleY = 300 / rect.height;
  const px = (evt.clientX - rect.left) * scaleX, py = (evt.clientY - rect.top) * scaleY;
  const angle = Math.atan2(py - 150, px - 150) * 180 / Math.PI;
  const deg = (angle + 90 + 360) % 360;
  const dist = Math.hypot(px - 150, py - 150);
  return { deg, dist };
}
function qclk_updateHands(state) {
  const hourDeg = (state.hour % 12) * 30 + state.minute * 0.5;
  const minDeg = state.minute * 6;
  if (state._hourHand) state._hourHand.setAttribute('transform', `rotate(${hourDeg} 150 150)`);
  if (state._minHand) state._minHand.setAttribute('transform', `rotate(${minDeg} 150 150)`);
}
function qclk_dispHour(state) { return state.hour === 0 ? 12 : state.hour; }
function qclk_buildSVG(svgId, state, onChange) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  const cx = 150, cy = 150, R = 130;
  svg.appendChild(svgEl('circle', { cx, cy, r: R, fill: '#fff', stroke: 'var(--ocean)', 'stroke-width': 6 }));
  for (let i = 0; i < 60; i++) {
    const ang = i * 6 * Math.PI / 180;
    const isHour = i % 5 === 0;
    const r1 = isHour ? R - 16 : R - 8;
    const x1 = cx + r1 * Math.sin(ang), y1 = cy - r1 * Math.cos(ang);
    const x2 = cx + (R - 2) * Math.sin(ang), y2 = cy - (R - 2) * Math.cos(ang);
    svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke: '#075985', 'stroke-width': isHour ? 3 : 1 }));
  }
  for (let h = 1; h <= 12; h++) {
    const ang = h * 30 * Math.PI / 180, r = R - 38;
    const x = cx + r * Math.sin(ang), y = cy - r * Math.cos(ang);
    const t = svgEl('text', { x, y: y + 7, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: '#075985' });
    t.textContent = h;
    svg.appendChild(t);
  }
  state._hourHand = svgEl('line', { x1: cx, y1: cy, x2: cx, y2: cy - 65, stroke: 'var(--sand)', 'stroke-width': 8, 'stroke-linecap': 'round' });
  state._minHand = svgEl('line', { x1: cx, y1: cy, x2: cx, y2: cy - 105, stroke: 'var(--ocean-dark)', 'stroke-width': 5, 'stroke-linecap': 'round' });
  svg.appendChild(state._hourHand); svg.appendChild(state._minHand);
  svg.appendChild(svgEl('circle', { cx, cy, r: 8, fill: 'var(--ocean-dark)' }));
  const grabDisc = svgEl('circle', { cx, cy, r: R, fill: 'transparent', style: 'cursor:pointer; touch-action:none;' });
  svg.appendChild(grabDisc);
  const HAND_PICK_RADIUS = 85;
  grabDisc.onpointerdown = (evt) => {
    const info = qclk_pointerInfo(svgId, evt);
    if (info.dist < 15) return;
    state.dragTarget = info.dist <= HAND_PICK_RADIUS ? 'hour' : 'minute';
    evt.preventDefault();
  };
  if (state._moveHandler) window.removeEventListener('pointermove', state._moveHandler);
  if (state._upHandler) window.removeEventListener('pointerup', state._upHandler);
  state._moveHandler = (evt) => {
    if (!state.dragTarget) return;
    if (!document.getElementById(svgId)) { state.dragTarget = null; return; }
    const info = qclk_pointerInfo(svgId, evt);
    if (state.dragTarget === 'hour') state.hour = Math.floor(info.deg / 30) % 12;
    else state.minute = Math.round(info.deg / 6) % 60;
    qclk_updateHands(state);
    if (onChange) onChange(state);
  };
  state._upHandler = () => { state.dragTarget = null; };
  window.addEventListener('pointermove', state._moveHandler);
  window.addEventListener('pointerup', state._upHandler);
  qclk_updateHands(state);
  if (onChange) onChange(state);
}

function g4_starPoints(cx, cy, rOuter, rInner) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? rOuter : rInner;
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    pts.push([cx + r * Math.cos(ang), cy + r * Math.sin(ang)]);
  }
  return pts.map(p => p.join(',')).join(' ');
}
const g4_SYMMETRY_SHAPES = [
